<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gdarchivio online</title>
    <link rel="icon" type="image/png" href="https://placehold.co/32x32/000000/FFFFFF/png?text=GD" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400;500&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Martian Mono', monospace; background-color: #ffffff; color: #000000; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #555; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes slideInFromRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide-in-right { animation: slideInFromRight 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .font-bitcount-single { font-family: 'Bitcount Single', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body.modal-open {
            overflow: hidden;
        }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
              'martian-mono': ['"Martian Mono"', 'monospace'], 
              'bitcount-single': ['"Bitcount Single"', 'monospace'], 
            },
            colors: { 
              'dark-gray': '#333333', 
              'cold-gray': '#888888', 
            }
          }
        }
      };
    </script>
</head>
<body class="antialiased">
    
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="subject"></select>
      <textarea name="message"></textarea>
    </form>
    <form name="inquiry" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="text" name="product-inquiry" />
    </form>
    
    <noscript>Per visualizzare questa applicazione, è necessario abilitare JavaScript.</noscript>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <script>
    window.addEventListener('load', runApp);

    function runApp() {
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            console.error('React o ReactDOM non sono stati caricati.');
            return;
        }

        const { useState, useEffect, useMemo, useCallback, Fragment, useRef } = React;
        const { createRoot } = ReactDOM;
        const e = React.createElement;
        
        // ==========================================================
        // COSTANTI E FUNZIONI UTILI
        // ==========================================================
        const getPlaceholderImageUrl = (width, height, text) => `https://placehold.co/${width}x${height}/f0f0f0/333?text=${encodeURIComponent(text)}`;

        // ==========================================================
        // FUNZIONE PER GENERARE I FILTRI DINAMICI
        // ==========================================================
        const generateFilterOptions = (products, libraryItems) => {
            const collectionItems = products.filter(p => p.type === 'product');
            const archiveItems = products.filter(p => p.type === 'archive');

            const getUniqueSortedValues = (items, key) => {
                const values = items
                    .map(item => item[key])
                    .filter(value => value !== null && value !== undefined && value !== ''); 
                
                const uniqueValues = [...new Set(values)];

                uniqueValues.sort((a, b) => {
                    if (key === 'year' && typeof a === 'number' && typeof b === 'number') {
                        return b - a; 
                    }
                    return String(a).localeCompare(String(b), undefined, { numeric: true });
                });
                
                return uniqueValues;
            };

            return {
                collection: {
                    brand: getUniqueSortedValues(collectionItems, 'brand'),
                    category: getUniqueSortedValues(collectionItems, 'category'),
                    color: getUniqueSortedValues(collectionItems, 'color'),
                    size: getUniqueSortedValues(collectionItems, 'size'),
                    year: getUniqueSortedValues(collectionItems, 'year'),
                },
                archive: {
                    brand: getUniqueSortedValues(archiveItems, 'brand'),
                    category: getUniqueSortedValues(archiveItems, 'category'),
                    color: getUniqueSortedValues(archiveItems, 'color'),
                    size: getUniqueSortedValues(archiveItems, 'size'),
                    year: getUniqueSortedValues(archiveItems, 'year'),
                },
                library: {
                    author: getUniqueSortedValues(libraryItems, 'author'),
                    category: getUniqueSortedValues(libraryItems, 'category'),
                    year: getUniqueSortedValues(libraryItems, 'year'),
                }
            };
        };


        const sortOptions = ['name a–z', 'name z–a', 'brand a-z', 'brand z-a', 'year old to new', 'year new to old'];
        
        // ==========================================================
        // COMPONENTI ICONA INLINE
        // ==========================================================
        const Icon = ({ name, size = 16, className = '' }) => {
            const iconProps = { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className: className };
            const icons = {
                Search: e('svg', iconProps, e('circle', { cx: '11', cy: '11', r: '8' }), e('line', { x1: '21', y1: '21', x2: '16.65', y2: '16.65' })),
                ChevronDown: e('svg', iconProps, e('path', { d: 'm6 9 6 6 6-6' })),
                ArrowLeft: e('svg', iconProps, e('path', { d: 'm12 19-7-7 7-7' }), e('path', { d: 'M19 12H5' })),
                ExternalLink: e('svg', iconProps, e('path', { d: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6' }), e('polyline', { points: '15 3 21 3 21 9' }), e('line', { x1: '10', y1: '14', x2: '21', y2: '3' })),
                X: e('svg', iconProps, e('line', { x1: '18', y1: '6', x2: '6', y2: '18' }), e('line', { x1: '6', y1: '6', x2: '18', y2: '18' })),
                Filter: e('svg', iconProps, e('polygon', { points: '22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3' })),
                Menu: e('svg', iconProps, e('line', { x1: '3', y1: '12', x2: '21', y2: '12' }), e('line', { x1: '3', y1: '6', x2: '21', y2: '6' }), e('line', { x1: '3', y1: '18', x2: '21', y2: '18' })),
                Instagram: e('svg', iconProps, e('rect', { x: '2', y: '2', width: '20', height: '20', rx: '5', ry: '5' }), e('path', { d: 'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z' }), e('line', { x1: '17.5', y1: '6.5', x2: '17.51', y2: '6.5' })),
                Heart: e('svg', iconProps, e('path', { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'})),
                HeartFilled: e('svg', {...iconProps, fill: 'currentColor', stroke: 'currentColor'}, e('path', { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'})),
                Share: e('svg', iconProps, e('circle', {cx: '18', cy: '5', r: '3'}), e('circle', {cx: '6', cy: '12', r: '3'}), e('circle', {cx: '18', cy: '19', r: '3'}), e('line', {x1: '8.59', y1: '13.51', x2: '15.42', y2: '17.49'}), e('line', {x1: '15.41', y1: '6.51', x2: '8.59', y2: '10.49'})),
                Mail: e('svg', iconProps, e('path', { d: 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z' }), e('polyline', { points: '22,6 12,13 2,6' }))
            };
            return icons[name] || null;
        };

        // ==========================================================
        // COMPONENTI DROPDOWN E PANEL
        // ==========================================================
        const FilterDropdown = ({ label, values, isOpen, onToggle, selectedValues, onFilterChange }) => {
            return e('div', { className: 'relative' },
                e('button', {
                    onClick: onToggle,
                    className: 'flex items-center gap-2 font-martian-mono text-sm'
                },
                    label.toLowerCase(),
                    e(Icon, { name: 'ChevronDown', size: 14, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}` })
                ),
                isOpen && e('div', { className: 'absolute top-full left-0 mt-2 w-72 bg-white border rounded-lg shadow-xl animate-fade-in z-30' },
                    e('div', { className: 'max-h-80 overflow-y-auto p-2' },
                        values.map(option => e('label', {
                            key: option,
                            className: 'flex items-center w-full text-left px-4 py-2 font-martian-mono text-sm hover:bg-gray-100 cursor-pointer rounded-md'
                        },
                           e('input', { 
                               type: 'checkbox', 
                               className: 'hidden', 
                               checked: selectedValues.includes(String(option)),
                               onChange: () => onFilterChange(label, String(option))
                            }),
                           e('div', { className: `w-4 h-4 border border-gray-400 rounded-sm mr-3 flex-shrink-0 bg-white ${selectedValues.includes(String(option)) ? 'bg-black' : ''}` }),
                           String(option)
                        ))
                    )
                )
            );
        };
        
        const CustomSortDropdown = ({ options, selectedValue, onSelect, isOpen, onToggle }) => {
            return e('div', { className: 'relative' },
                e('button', {
                    onClick: onToggle,
                    className: 'flex items-center justify-between gap-2 font-martian-mono text-sm w-40 border-b border-gray-300 pb-1'
                },
                    selectedValue,
                    e(Icon, { name: 'ChevronDown', size: 14, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}` })
                ),
                isOpen && e('div', { className: 'absolute top-full right-0 mt-2 w-48 bg-white border rounded-lg shadow-xl animate-fade-in z-30' },
                    e('div', { className: 'p-2' },
                        options.map(option => e('button', {
                            key: option,
                            onClick: () => onSelect(option),
                            className: `block w-full text-left px-4 py-2 font-martian-mono text-sm rounded-md ${selectedValue === option ? 'bg-gray-100' : 'hover:bg-gray-100'}`
                        }, option))
                    )
                )
            );
        };
        
        const MobileFilterPanel = ({ options, initialFilters, selectedFilters, onApply, onClose }) => {
            const [tempFilters, setTempFilters] = useState(selectedFilters);
            const [openCategory, setOpenCategory] = useState(null);

            useEffect(() => {
                document.body.classList.add('modal-open');
                return () => {
                    document.body.classList.remove('modal-open');
                };
            }, []);

            const handleFilterChange = (filterType, value) => {
                setTempFilters(prev => {
                    const currentValues = prev[filterType] || [];
                    const newValues = currentValues.includes(value)
                        ? currentValues.filter(v => v !== value)
                        : [...currentValues, value];
                    return { ...prev, [filterType]: newValues };
                });
            };
            
            const handleReset = () => {
                setTempFilters(initialFilters);
            };
            
            const handleApply = () => {
                onApply(tempFilters);
                onClose();
            };
            
            const totalSelections = useMemo(() => {
                return Object.values(tempFilters).reduce((sum, arr) => sum + arr.length, 0);
            }, [tempFilters]);

            const AccordionItem = ({ label, values }) => {
                const isOpen = openCategory === label;
                return e('div', { className: 'border-b' },
                    e('button', { 
                        onClick: () => setOpenCategory(isOpen ? null : label),
                        className: 'w-full flex justify-between items-center py-4 px-4'
                    },
                        e('span', { className: 'font-martian-mono uppercase' }, label),
                        e(Icon, { name: 'ChevronDown', size: 20, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`})
                    ),
                    isOpen && e('div', { className: 'px-4 pb-4 max-h-60 overflow-y-auto'},
                        values.map(option => e('label', {
                            key: option,
                            className: 'flex items-center w-full text-left py-2 font-martian-mono text-sm hover:bg-gray-100 cursor-pointer rounded-md'
                        },
                           e('input', { type: 'checkbox', className: 'hidden', checked: (tempFilters[label] || []).includes(String(option)), onChange: () => handleFilterChange(label, String(option)) }),
                           e('div', { className: `w-5 h-5 border border-gray-400 rounded-sm mr-3 flex-shrink-0 bg-white ${(tempFilters[label] || []).includes(String(option)) ? 'bg-black' : ''}` }),
                           String(option)
                        ))
                    )
                );
            };

            return e('div', { className: 'fixed inset-0 z-50' },
                e('div', { className: 'absolute inset-0 bg-black bg-opacity-50', onClick: onClose }),
                e('div', { className: 'absolute top-0 right-0 bottom-0 h-full bg-white w-full max-w-sm flex flex-col animate-slide-in-right' },
                    e('header', { className: 'flex items-center justify-between p-4 border-b' },
                        e('h3', { className: 'font-martian-mono text-lg font-bold uppercase' }, 'FILTER'),
                        e('button', { onClick: onClose }, e(Icon, { name: 'X', size: 24 }))
                    ),
                    e('main', { className: 'flex-1 overflow-y-auto' },
                        Object.entries(options).map(([label, values]) => e(AccordionItem, { key: label, label, values }))
                    ),
                    e('footer', { className: 'p-4 border-t flex items-center gap-4' },
                        e('button', { onClick: handleReset, className: 'font-martian-mono uppercase underline' }, 'Reset'),
                        e('button', { onClick: handleApply, className: 'flex-1 bg-black text-white py-3 font-martian-mono uppercase tracking-wider text-sm' }, `Mostra risultati (${totalSelections})`)
                    )
                )
            );
        };

        // ==========================================================
        // COMPONENTI UI RIUTILIZZABILI
        // ==========================================================
        const Header = ({ navigateTo, currentRoute, searchQuery, onSearchChange }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navItems = [
                { label: 'Collection', page: '#collection' },
                { label: 'Archive', page: '#archive' },
                { label: 'Library', page: '#library' },
                { label: 'Contact', page: '#contact' }
            ];

            const navigateAndClose = (path) => {
                navigateTo(path);
                setIsMenuOpen(false);
            };

            useEffect(() => {
                if (isMenuOpen) {
                    document.body.classList.add('modal-open');
                } else {
                    document.body.classList.remove('modal-open');
                }
                return () => {
                    document.body.classList.remove('modal-open');
                };
            }, [isMenuOpen]);

            return e(Fragment, null, 
                e('header', { className: 'sticky top-0 bg-white bg-opacity-80 backdrop-blur-sm border-b border-gray-200 z-40' },
                    e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                        e('div', { className: 'flex items-center justify-between h-20' },
                            e('a', { href: '#home', onClick: (ev) => { ev.preventDefault(); navigateAndClose('#home'); }, className: 'flex items-center gap-3' },
                                e('div', { className: 'w-8 h-8 border border-black flex-shrink-0' }),
                                e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                            ),
                            e('div', { className: 'hidden md:flex items-center gap-x-12 ml-auto' },
                                e('nav', { className: 'flex items-center space-x-8' },
                                    navItems.map(item => e('a', {
                                        key: item.label,
                                        href: item.page,
                                        onClick: (ev) => { ev.preventDefault(); navigateTo(item.page); },
                                        className: `font-martian-mono uppercase tracking-wider text-sm ${currentRoute.startsWith(item.page) ? 'font-bold' : 'font-normal'} hover:font-bold transition-all`
                                    }, item.label))
                                ),
                                e('div', { className: 'relative' },
                                    e('input', { 
                                        type: 'text', 
                                        placeholder: 'search', 
                                        className: 'border-b border-gray-300 py-1.5 pl-0 pr-8 w-40 text-sm focus:outline-none focus:border-black font-martian-mono placeholder-cold-gray bg-transparent',
                                        value: searchQuery,
                                        onChange: (ev) => onSearchChange(ev.target.value)
                                    }),
                                    e('div', { className: 'absolute inset-y-0 right-0 flex items-center pr-1 pointer-events-none' }, e(Icon, { name: 'Search', size: 16, className: 'text-gray-400' }))
                                )
                            ),
                            e('button', { className: 'md:hidden ml-auto', onClick: () => setIsMenuOpen(!isMenuOpen) },
                                e(Icon, { name: isMenuOpen ? 'X' : 'Menu', size: 24 })
                            )
                        )
                    )
                ),
                isMenuOpen && e('div', { className: 'fixed inset-0 bg-white z-50 p-4 animate-fade-in md:hidden' },
                    e('div', { className: 'flex justify-between items-center mb-12'},
                        e('a', { href: '#home', onClick: (ev) => { ev.preventDefault(); navigateAndClose('#home'); }, className: 'flex items-center gap-3' },
                            e('div', { className: 'w-8 h-8 border border-black flex-shrink-0' }),
                            e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                        ),
                        e('button', { className: 'md:hidden', onClick: () => setIsMenuOpen(false) },
                            e(Icon, { name: 'X', size: 24 })
                        )
                    ),
                    e('nav', { className: 'flex flex-col items-center justify-center space-y-8' },
                         navItems.map(item => e('a', {
                            key: item.label,
                            href: item.page,
                            onClick: (ev) => { ev.preventDefault(); navigateAndClose(item.page); },
                            className: 'font-martian-mono uppercase tracking-wider text-2xl'
                        }, item.label))
                    )
                )
            );
        };

        const Footer = () => {
             return e('footer', { className: 'bg-white' },
                e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                    e('div', { className: 'py-12 text-left border-t border-gray-200' },
                        e('a', { href: '#home', className: 'flex items-center gap-3 mb-6' },
                             e('div', { className: 'w-8 h-8 border border-black flex-shrink-0' }),
                            e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                        ),
                        e('p', { className: 'font-martian-mono text-sm text-dark-gray max-w-md' }, 'curated fashion archive. authentic pieces from the world\'s most iconic maisons.'),
                        e('a', {
                            href: 'https://instagram.com',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            className: 'font-martian-mono text-sm uppercase tracking-wider mt-6 inline-block hover:underline'
                        }, 'Instagram')
                    )
                ),
                e('div', { className: 'border-t border-gray-200' },
                    e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                         e('p', { className: 'text-center font-martian-mono text-xs text-cold-gray py-8' }, '© 2025 GDARCHIVIO. ALL RIGHTS RESERVED.')
                    )
                )
            );
        };
        
        const FilterBar = ({ options, initialFilters, selectedFilters, onFilterChange, onResetFilters, onApplyFilters, sortOrder, onSortChange }) => {
            const [openFilter, setOpenFilter] = useState(null);
            const [isPanelOpen, setIsPanelOpen] = useState(false);
            const barRef = useRef(null);
            
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (barRef.current && !barRef.current.contains(event.target)) {
                        setOpenFilter(null);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);
            
            const handleToggle = (label) => {
                setOpenFilter(prev => (prev === label ? null : label));
            };

            return e('div', { className: 'sticky top-20 bg-white z-20 py-4 border-b border-gray-200 mb-8', ref: barRef },
                e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                    e('div', { className: 'hidden md:flex items-center justify-between' },
                        e('div', { className: 'flex items-center gap-x-4 flex-wrap' },
                            e(Icon, { name: 'Filter', size: 20, className: 'text-cold-gray flex-shrink-0' }),
                            e('span', { className: 'font-martian-mono text-sm text-cold-gray uppercase flex-shrink-0' }, 'Filter:'),
                            Object.entries(options).map(([label, values]) => e(FilterDropdown, { 
                                key: label, 
                                label, 
                                values,
                                isOpen: openFilter === label,
                                onToggle: () => handleToggle(label),
                                selectedValues: selectedFilters[label] || [],
                                onFilterChange
                            })),
                            (Object.values(selectedFilters).some(arr => arr.length > 0)) && e('button', {
                                onClick: onResetFilters,
                                className: 'font-martian-mono text-sm text-cold-gray hover:text-black underline ml-4'
                            }, 'Reset filters')
                        ),
                        e('div', {className: 'ml-4'}, 
                            e(CustomSortDropdown, {
                                options: sortOptions,
                                selectedValue: sortOrder,
                                onSelect: (option) => { onSortChange(option); handleToggle('sort'); },
                                isOpen: openFilter === 'sort',
                                onToggle: () => handleToggle('sort')
                            })
                        )
                    ),
                    e('div', { className: 'md:hidden flex items-center justify-between' },
                        e('button', { 
                            onClick: () => setIsPanelOpen(true),
                            className: 'flex items-center gap-2 font-martian-mono uppercase text-sm'
                        },
                            e(Icon, { name: 'Filter', size: 20 }),
                            'FILTER'
                        ),
                        e(CustomSortDropdown, {
                            options: sortOptions,
                            selectedValue: sortOrder,
                            onSelect: (option) => { onSortChange(option); handleToggle('sort'); },
                            isOpen: openFilter === 'sort',
                            onToggle: () => handleToggle('sort')
                        })
                    )
                ),
                isPanelOpen && e(MobileFilterPanel, { 
                    options, 
                    initialFilters, 
                    selectedFilters, 
                    onApply: onApplyFilters, 
                    onClose: () => setIsPanelOpen(false) 
                })
            );
        };

        const ItemCard = ({ item, navigateTo, page }) => {
            const meta = [item.year, item.category, item.color, item.size].filter(Boolean).join(' • ');
            return e('div', {
                className: "group cursor-pointer flex flex-col",
                onClick: () => navigateTo(page, item)
            },
                e('div', { className: "aspect-square bg-gray-100 overflow-hidden" },
                    e('img', { src: item.images[0], alt: item.name, className: "w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" })
                ),
                e('div', { className: 'mt-3 text-left flex-grow' },
                    e('h3', { className: "font-martian-mono uppercase font-bold text-sm text-black" }, item.author || item.brand),
                    e('p', { className: "font-martian-mono uppercase text-sm text-cold-gray" }, item.name),
                    e('p', { className: "font-martian-mono text-xs text-cold-gray mt-1" }, meta)
                )
            );
        };
        
        const Modal = ({ isOpen, onClose, children, title }) => {
            useEffect(() => {
                if (isOpen) {
                    document.body.classList.add('modal-open');
                } else {
                    document.body.classList.remove('modal-open');
                }
                return () => {

                        : [...currentValues, value];
                    return { ...prevFilters, [filterType]: newValues };
                });
            }, []);
            
            const handleResetFilters = useCallback(() => {
                setSelectedFilters(initialFilters);
            }, [initialFilters]);

            const handleApplyFilters = useCallback((newFilters) => {
                setSelectedFilters(newFilters);
            }, []);
            
            const processedItems = useMemo(() => {
                let filtered = items.filter(item => {
                    const filterMatch = Object.entries(selectedFilters).every(([key, values]) => {
                        if (values.length === 0) return true;
                        const itemValue = item[key] || (key === 'author' && item.brand);
                        return values.includes(String(itemValue));
                    });

                    if (!filterMatch) return false;

                    if (!searchQuery) return true;
                    const query = searchQuery.toLowerCase();
                    const nameMatch = (item.name || '').toLowerCase().includes(query);
                    const brandMatch = (item.brand || '').toLowerCase().includes(query);
                    const authorMatch = (item.author || '').toLowerCase().includes(query);
                    const descriptionMatch = (item.description || '').toLowerCase().includes(query);
                    
                    return nameMatch || brandMatch || authorMatch || descriptionMatch;
                });

                const [field, orderPart1, orderPart2] = sortOrder.split(' ');
                const order = `${orderPart1} ${orderPart2}`;
                const sortKey = field === 'name' ? 'name' : (field === 'brand' ? 'brand' : 'year');

                filtered.sort((a, b) => {
                    const valA = a[sortKey];
                    const valB = b[sortKey];
                    let comparison = 0;
                    if (typeof valA === 'string') {
                        comparison = valA.localeCompare(valB);
                    } else if (typeof valA === 'number') {
                        comparison = valA - valB;
                    }
                    return order.includes('a-z') || order.includes('old') ? comparison : comparison * -1;

            );

            return e('main', { className: 'container mx-auto px-4 sm:px-6 lg:px-8 py-12' },
                 e('h2', { className: 'font-martian-mono uppercase font-bold text-xl mb-1' }, 'CONTACT'),
                 e('p', { className: 'font-martian-mono text-sm text-dark-gray' }, 'questions about a specific piece? want more information? we\'re here to help.'),
                 e('div', { className: 'border-b border-gray-200 mt-4 mb-10' }),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-x-12' },
                    e('div', { className: 'mb-12 md:mb-0' },
                        submitted ? successMessage : e(Fragment, null,
                            e('h3', { className: 'font-martian-mono text-lg font-bold uppercase mb-4' }, 'SEND A MESSAGE'),
                            e('form', { name: "contact", "data-netlify": "true", onSubmit: handleSubmit },
                                e('input', { type: 'hidden', name: 'form-name', value: 'contact' }),
                                e(FormInput, { id: 'name', label: 'Name', placeholder: 'your full name' }),
                                e(FormInput, { id: 'email', label: 'Email', type: 'email', placeholder: 'your.email@example.com' }),
                                e(FormSelect, { id: 'subject', label: 'Subject' },
                                    e('option', { value: '' }, 'select message subject'),
                                    e('option', { value: 'inquiry' }, 'product inquiry'),
                                    e('option', { value: 'research' }, 'research request'),
                                    e('option', { value: 'other' }, 'other')
                                ),
                                e(FormTextarea, { id: 'message', label: 'Message', placeholder: 'write your message here…' }),
                                e('button', { type: 'submit', className: 'bg-black text-white py-3 px-8 font-martian-mono uppercase tracking-wider text-sm font-bold hover:bg-dark-gray transition-colors' }, 'SEND MESSAGE')
                            )
                        )
                    ),
                    e('div', null,
                         e('h3', { className: 'font-martian-mono text-lg font-bold uppercase mb-4' }, 'GET IN TOUCH'),
                        e('div', { className: 'pb-8 mb-8 border-b border-gray-100' },
                            e('div', {className: 'flex items-center gap-2 mb-1'},
                                e(Icon, {name: 'Mail', size: 16, className: 'text-cold-gray'}),
                                e('p', { className: 'font-martian-mono text-xs uppercase text-cold-gray' }, 'Email')
                            ),
                            // MODIFICATO: Email aggiornata
                            e('p', { className: 'font-martian-mono text-sm' }, e('a', { href: 'mailto:info@gdarchivio.com', className: 'underline' }, 'info@gdarchivio.com')),
                        ),
                        e('div', { className: 'pb-8 mb-8 border-b border-gray-100' },
                           e('h4', { className: 'font-martian-mono uppercase font-bold text-sm mb-2' }, 'Follow Us'),
                           e('a', {href: 'https://instagram.com', target: '_blank', rel: 'noopener noreferrer', className: 'flex items-center gap-2 text-sm font-martian-mono'}, e(Icon, {name: 'Instagram'}), 'Instagram')
                        ),
                        e('div', null,
                            e('h4', { className: 'font-martian-mono uppercase font-bold text-sm mb-4' }, 'Frequently Asked'),
                            e('div', { className: 'space-y-4' },
                                e('div', null,
                                  e('p', { className: 'font-martian-mono text-sm font-bold' }, 'IS THIS AN ONLINE ARCHIVE ONLY?'),
                                  e('p', { className: 'font-martian-mono text-sm mt-1 text-dark-gray' }, 'yes, gdarchivio operates as a digital fashion archive. Consultations and viewing can be arranged by appointment.')
                                ),
                                e('div', null,
                                  e('p', { className: 'font-martian-mono text-sm font-bold' }, 'CAN I CONTRIBUTE TO THE ARCHIVE?'),
                                  e('p', { className: 'font-martian-mono text-sm mt-1 text-dark-gray' }, 'we welcome contributions from collectors and fashion enthusiasts. Contact us to discuss adding pieces to our archive.')
                                )
                            )
                        )
                    )
                )
            );
        };

        // ==========================================================
        // APPLICAZIONE PRINCIPALE E ROUTING - MODIFICATO PER FILTRI DINAMICI
        // ==========================================================
        const App = () => {
            const [route, setRoute] = useState(window.location.hash || '#home');
            const [products, setProducts] = useState([]);
            const [libraryItems, setLibraryItems] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [dynamicFilterOptions, setDynamicFilterOptions] = useState(null);

            useEffect(() => {
                Promise.all([
                    fetch('./products.json').then(res => res.json()),
                    fetch('./library.json').then(res => res.json())
                ]).then(([productData, libraryData]) => {
                    setProducts(productData);
                    setLibraryItems(libraryData);
                    // Genera e imposta le opzioni dei filtri dopo aver caricato i dati
                    setDynamicFilterOptions(generateFilterOptions(productData, libraryData));
                }).catch(error => console.error("Errore nel caricamento dei dati JSON:", error));
            }, []);

            useEffect(() => {
                const handleHashChange = () => {
                    setRoute(window.location.hash || '#home');
                    window.scrollTo(0, 0);
                };
                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);
            
            const navigateTo = useCallback((path, item = null) => {
                const newRoute = item ? `${path}/${item.id}` : path;
                if (window.location.hash !== newRoute) {
                  window.history.pushState(null, '', newRoute);
                }
                setRoute(newRoute);
                window.scrollTo(0, 0);
            }, []);

            const renderPage = () => {
                // Mostra un messaggio di caricamento finché i dati e i filtri non sono pronti
                if (!dynamicFilterOptions) {
                    return e('div', { className: 'flex justify-center items-center h-screen' }, 
                        e('p', { className: 'font-martian-mono' }, 'Loading archive...')
                    );
                }

                const [page, id] = route.substring(1).split('/');
                const allItems = [...products, ...libraryItems];
                const item = allItems.find(p => p.id === id);

                if (id && !item && (products.length > 0 || libraryItems.length > 0)) {
                    navigateTo(page.startsWith('#') ? page : `#${page}`);
                    return null;
                }
                
                if (!item && id) {
                    return e('div', { className: 'text-center p-8' }, 'Loading item...');
                }

                switch (page) {
                    case 'collection':
                        return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { items: products.filter(p => p.type === 'product'), navigateTo, page: '#collection', options: dynamicFilterOptions.collection, searchQuery: searchQuery });
                    case 'archive':
                        return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { items: products.filter(p => p.type === 'archive'), navigateTo, page: '#archive', options: dynamicFilterOptions.archive, searchQuery: searchQuery });
                    case 'library':
                        return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { items: libraryItems, navigateTo, page: '#library', options: dynamicFilterOptions.library, searchQuery: searchQuery });
                    case 'contact':
                        return e(ContactPage, { navigateTo });
                    case 'home':
                    default:
                        return e(HomePage, { navigateTo });
                }
            };
            
            const isHomePage = route === '#home' || route === '';

            return e('div', { key: route, className: 'animate-fade-in' },
                !isHomePage && e(Header, { navigateTo, currentRoute: route, searchQuery: searchQuery, onSearchChange: setSearchQuery }),
                renderPage(),
                !isHomePage && e(Footer)
            );
        };
        
        // --- Avvio dell'applicazione ---
        const rootElement = document.getElementById('root');
        if (rootElement) {
            createRoot(rootElement).render(e(App));
        } else {
            console.error("L'elemento 'root' non è stato trovato nel DOM.");
        }
    }
    </script>
</body>
</html>
