<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gdarchivio online</title>
    <link rel="icon" type="image/png" href="https://placehold.co/32x32/000000/FFFFFF/png?text=GD" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400;500&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Martian Mono', monospace; background-color: #ffffff; color: #000000; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #555; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        .header-logo {
            height: 40px; 
            width: auto;
            /* FIX LOGO: ASSICURA CHE L'IMMAGINE NON SI STRECCHI */
            object-fit: contain; 
        }
        @media (min-width: 768px) {
            .header-logo {
                height: 50px; 
            }
        }
    </style>
    
</head>
<body>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <script type="text/babel">
    const { useState, useEffect, createElement: e, useRef } = React;
    const { createRoot } = ReactDOM;

    const DATA_URLS = {
        products: 'products.json',
        library: 'library.json',
    };

    const PRODUCTS_PER_PAGE = 12;

    // --- Data Loading and Filtering ---

    const useData = () => {
        const [data, setData] = useState({ products: [], library: [] });
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const loadData = async () => {
                try {
                    const [productsRes, libraryRes] = await Promise.all([
                        fetch(DATA_URLS.products).then(res => res.json()),
                        fetch(DATA_URLS.library).then(res => res.json()),
                    ]);
                    
                    const archiveProducts = productsRes.filter(p => p.type === 'archive');
                    const regularProducts = productsRes.filter(p => p.type === 'product');
                    
                    setData({
                        products: regularProducts,
                        archive: archiveProducts,
                        library: libraryRes,
                    });
                } catch (error) {
                    console.error("Error loading data:", error);
                } finally {
                    setLoading(false);
                }
            };
            loadData();
        }, []);

        return { data, loading };
    };

    const useDynamicFilters = (items) => {
        const getUniqueValues = (key) => [...new Set(items.map(item => item[key]).filter(Boolean))].sort();
        
        return {
            brands: getUniqueValues('brand'),
            categories: getUniqueValues('category'),
            colors: getUniqueValues('color'),
            years: getUniqueValues('year'),
        };
    };

    // --- Utility Components ---

    const ScrollToTop = (currentRoute) => {
        useEffect(() => {
            window.scrollTo(0, 0);
        }, [currentRoute]);
        return null;
    };

    const FilterSidebar = ({ options, filters, onFilterChange }) => {
        const renderFilterGroup = (title, key, values) => {
            if (values.length === 0) return null;

            return e('div', { key: key, className: 'mb-4 border-t border-black pt-4' },
                e('h3', { className: 'font-bold mb-2 text-lg' }, title),
                e('div', { className: 'space-y-1' },
                    values.map(value => e('label', { key: value, className: 'flex items-center text-sm cursor-pointer' },
                        e('input', {
                            type: 'checkbox',
                            checked: filters[key]?.includes(value),
                            onChange: (e) => onFilterChange(key, value, e.target.checked),
                            className: 'mr-2 cursor-pointer'
                        }),
                        value
                    ))
                )
            );
        };

        return e('div', { className: 'p-4 border-r border-black md:sticky md:top-0 h-full overflow-y-auto' },
            e('div', { className: 'mb-6' }, 
                e('button', {
                    onClick: () => onFilterChange(null, null, false, true), // Clear all
                    className: 'text-sm underline'
                }, 'Cancella Filtri')
            ),
            renderFilterGroup('Brand', 'brand', options.brands),
            renderFilterGroup('Categoria', 'category', options.categories),
            renderFilterGroup('Colore', 'color', options.colors),
            renderFilterGroup('Anno', 'year', options.years),
        );
    };
    
    // --- Page Components ---

    const Header = ({ navigateTo, currentRoute, searchQuery, onSearchChange }) => {
        const menuItems = [
            { route: '#home', label: 'Home' },
            { route: '#product', label: 'Shop' },
            { route: '#archive', label: 'Archivio' },
            { route: '#library', label: 'Library' },
            { route: '#contact', label: 'Contatti' }
        ];

        return e('header', { className: 'bg-white sticky top-0 z-10 border-b border-black shadow-md' },
            e('div', { className: 'container mx-auto p-4 flex justify-between items-center' },
                e('div', { className: 'flex items-center space-x-4' },
                    e('img', { 
                        src: 'images/logo.png', 
                        alt: 'gdarchivio logo', 
                        className: 'header-logo w-auto max-h-[40px] md:max-h-[50px] cursor-pointer',
                        onClick: () => navigateTo('#home')
                    }),
                    e('nav', { className: 'hidden md:flex space-x-4' },
                        menuItems.slice(1).map(item => e('a', { 
                            key: item.route, 
                            href: item.route, 
                            className: `text-sm hover:underline ${currentRoute === item.route ? 'font-bold underline' : ''}`
                        }, item.label))
                    )
                ),
                e('div', { className: 'flex items-center space-x-4' },
                    currentRoute !== '#home' && e('input', {
                        type: 'text',
                        placeholder: 'Cerca...',
                        value: searchQuery,
                        onChange: (e) => onSearchChange(e.target.value),
                        className: 'p-2 border border-black rounded text-sm w-32 md:w-48'
                    }),
                    e('div', { className: 'md:hidden' }, 'Menu') // Mobile Menu Placeholder
                )
            )
        );
    };

    const Footer = () => {
        return e('footer', { className: 'bg-black text-white p-6 mt-10' },
            e('div', { className: 'container mx-auto text-center text-xs' },
                e('p', null, '© 2025 gdarchivio. All rights reserved.')
            )
        );
    };

    const Pagination = ({ totalItems, itemsPerPage, currentPage, onPageChange }) => {
        const totalPages = Math.ceil(totalItems / itemsPerPage);

        if (totalPages <= 1) return null;

        const renderPageButton = (pageNumber) => {
            const isActive = pageNumber === currentPage;
            return e('button', {
                key: pageNumber,
                onClick: () => onPageChange(pageNumber),
                disabled: isActive,
                className: `px-3 py-1 border border-black text-sm transition-colors ${isActive ? 'bg-black text-white' : 'hover:bg-gray-100'}`
            }, pageNumber);
        };

        const pagesToShow = [];
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, currentPage + 2);

        if (startPage === 1 && totalPages > 5) endPage = 5;
        if (endPage === totalPages && totalPages > 5) startPage = Math.max(1, totalPages - 4);

        for (let i = startPage; i <= endPage; i++) {
            pagesToShow.push(i);
        }

        return e('div', { className: 'flex justify-center space-x-2 my-8' },
            e('button', {
                onClick: () => onPageChange(currentPage - 1),
                disabled: currentPage === 1,
                className: 'px-3 py-1 border border-black text-sm hover:bg-gray-100'
            }, 'Precedente'),

            (startPage > 1) && e(React.Fragment, null,
                renderPageButton(1),
                e('span', { className: 'px-2' }, '...'),
            ),

            pagesToShow.map(renderPageButton),

            (endPage < totalPages) && e(React.Fragment, null,
                e('span', { className: 'px-2' }, '...'),
                renderPageButton(totalPages),
            ),

            e('button', {
                onClick: () => onPageChange(currentPage + 1),
                disabled: currentPage === totalPages,
                className: 'px-3 py-1 border border-black text-sm hover:bg-gray-100'
            }, 'Successiva')
        );
    };

    const ListPage = ({ items, navigateTo, page, options, searchQuery, initialPage, setPage }) => {
        const [filters, setFilters] = useState({});
        const [currentPage, setCurrentPage] = useState(initialPage); 
        
        // Reset page to 1 on filter/search change
        useEffect(() => {
            setCurrentPage(1);
            setPage(1); // Mantiene lo stato dell'App sincronizzato
            navigateTo(page, null, 1); // Aggiorna URL hash
        }, [filters, searchQuery, page]);

        // Filter and Search Logic
        const filteredItems = items.filter(item => {
            const searchMatch = searchQuery
                ? Object.values(item).some(val => 
                    String(val).toLowerCase().includes(searchQuery.toLowerCase())
                  )
                : true;

            const filterMatch = Object.keys(filters).every(key => {
                const activeFilters = filters[key];
                if (activeFilters && activeFilters.length > 0) {
                    return activeFilters.includes(item[key]);
                }
                return true;
            });

            return searchMatch && filterMatch;
        });

        // Pagination Logic
        const totalItems = filteredItems.length;
        const totalPages = Math.ceil(totalItems / PRODUCTS_PER_PAGE);
        
        const startIndex = (currentPage - 1) * PRODUCTS_PER_PAGE;
        const paginatedItems = filteredItems.slice(startIndex, startIndex + PRODUCTS_PER_PAGE);

        const changePage = (pageNumber) => {
            if (pageNumber < 1 || pageNumber > totalPages) return;
            setCurrentPage(pageNumber);
            setPage(pageNumber); // Update the App's state
            navigateTo(page, null, pageNumber); // AGGIORNA HASH NELL'URL PER SALVARE LO STATO
        };

        const onFilterChange = (key, value, isChecked, clearAll = false) => {
            if (clearAll) {
                setFilters({});
                return;
            }
            
            setFilters(prev => {
                const newFilters = { ...prev };
                if (isChecked) {
                    newFilters[key] = [...(newFilters[key] || []), value];
                } else {
                    newFilters[key] = (newFilters[key] || []).filter(v => v !== value);
                    if (newFilters[key].length === 0) delete newFilters[key];
                }
                return newFilters;
            });
        };

        const renderItem = (item) => e('div', { 
            key: item.id, 
            className: 'border border-black p-4 cursor-pointer hover:bg-gray-100 transition-colors',
            onClick: () => navigateTo(page, item.id, currentPage), // PASSA currentPage QUANDO NAVIGHI AL DETTAGLIO
        },
            e('img', { 
                src: item.images ? item.images[0] : 'images/placeholder.jpg', 
                alt: item.name, 
                className: 'w-full h-80 object-cover mb-4' 
            }),
            e('div', { className: 'text-center' },
                e('h3', { className: 'font-bold text-lg' }, item.name),
                e('p', { className: 'text-sm' }, item.brand)
            )
        );

        return e('div', { className: 'container mx-auto p-4 flex flex-col md:flex-row' },
            e('div', { className: 'w-full md:w-1/4' },
                e(FilterSidebar, { options, filters, onFilterChange })
            ),
            e('div', { className: 'w-full md:w-3/4 p-4' },
                e('div', { className: 'text-center mb-6' },
                    e('h1', { className: 'text-2xl font-bold' }, page.substring(1).toUpperCase()),
                    e('p', { className: 'text-sm' }, `Trovati ${totalItems} risultati`)
                ),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6' },
                    paginatedItems.map(renderItem)
                ),
                e(Pagination, {
                    totalItems: totalItems,
                    itemsPerPage: PRODUCTS_PER_PAGE,
                    currentPage: currentPage,
                    onPageChange: changePage,
                })
            )
        );
    };

    const DetailPage = ({ item, navigateTo }) => {
        return e('div', { className: 'container mx-auto p-4' },
            e('button', { 
                onClick: () => window.history.back(), // USA history.back() per tornare allo stato precedente (incl. pagina)
                className: 'mb-4 px-4 py-2 border border-black hover:bg-gray-100 transition-colors'
            }, '← Torna all\'Archivio'),
            e('div', { className: 'border border-black p-6' },
                e('h1', { className: 'text-3xl font-bold mb-4' }, item.name),
                e('div', { className: 'flex flex-col md:flex-row gap-6' },
                    e('div', { className: 'md:w-1/2' },
                        item.images.map(imgSrc => e('img', { 
                            key: imgSrc, 
                            src: imgSrc, 
                            alt: item.name, 
                            className: 'w-full h-auto object-cover mb-4 border border-gray-300' 
                        }))
                    ),
                    e('div', { className: 'md:w-1/2' },
                        e('h2', { className: 'text-xl font-bold mb-2' }, item.brand),
                        e('p', { className: 'mb-4' }, item.description),
                        e('ul', { className: 'space-y-1 text-sm' },
                            e('li', null, e('strong', null, 'Categoria: '), item.category),
                            e('li', null, e('strong', null, 'Anno: '), item.year),
                            e('li', null, e('strong', null, 'Materiale: '), item.material),
                            e('li', null, e('strong', null, 'Colore: '), item.color),
                            e('li', null, e('strong', null, 'Taglia: '), item.size)
                        ),
                        item.type === 'product' && item.purchaseLinks && e('div', { className: 'mt-6' },
                            e('h3', { className: 'font-bold mb-2' }, 'Acquista su:'),
                            Object.keys(item.purchaseLinks).map(platform => e('a', {
                                key: platform,
                                href: item.purchaseLinks[platform],
                                target: '_blank',
                                className: 'inline-block mr-2 px-3 py-1 border border-black text-sm hover:bg-black hover:text-white transition-colors'
                            }, platform))
                        )
                    )
                )
            )
        );
    };

    const HomePage = ({ navigateTo }) => {
        return e('div', { className: 'container mx-auto p-4 text-center' },
            e('h1', { className: 'text-4xl font-bold mb-8' }, 'Benvenuto in gdarchivio'),
            e('p', { className: 'text-lg mb-8' }, 'Esplora il nostro archivio e la nostra selezione di prodotti in vendita.'),
            e('div', { className: 'space-y-4' },
                e('button', {
                    onClick: () => navigateTo('#product'),
                    className: 'w-full md:w-1/3 px-6 py-3 border border-black hover:bg-black hover:text-white transition-colors text-lg'
                }, 'Vai allo Shop'),
                e('button', {
                    onClick: () => navigateTo('#archive'),
                    className: 'w-full md:w-1/3 px-6 py-3 border border-black hover:bg-black hover:text-white transition-colors text-lg'
                }, 'Esplora l\'Archivio')
            )
        );
    };

    const ContactPage = ({ navigateTo }) => {
        return e('div', { className: 'container mx-auto p-4' },
            e('h1', { className: 'text-4xl font-bold mb-6 text-center' }, 'Contatti'),
            e('div', { className: 'max-w-md mx-auto border border-black p-6' },
                e('p', { className: 'mb-4' }, 'Per qualsiasi informazione, richiesta di collaborazione o dettagli sui prodotti, contattaci:'),
                e('ul', { className: 'space-y-2' },
                    e('li', null, e('strong', null, 'Email:'), ' [La tua Email]'),
                    e('li', null, e('strong', null, 'Instagram:'), ' @dididdi126'),
                    e('li', null, 'o usa il form sottostante (non implementato in questo codice).')
                )
            )
        );
    };

    // --- Main Application Component ---

    const App = () => {
        const { data, loading } = useData();
        
        // STATO MODIFICATO: Aggiunto lo stato 'page' per il numero di pagina
        const [route, setRoute] = useState(() => window.location.hash.split('/')[0] || '#home');
        const [id, setId] = useState(() => window.location.hash.split('/')[1] || null);
        const [searchQuery, setSearchQuery] = useState('');
        const [page, setPage] = useState(1); // Nuovo stato per il numero di pagina

        const dynamicFilterOptions = {
            product: useDynamicFilters(data.products),
            archive: useDynamicFilters(data.archive),
            library: useDynamicFilters(data.library),
        };

        // FUNZIONE MODIFICATA: Legge la URL Hash includendo il parametro di pagina (?p=X)
        const navigate = () => {
            const fullHash = window.location.hash.substring(1); 
            let [routePart, paramsPart] = fullHash.split('?');

            const parts = routePart.split('/');
            const newRoute = '#' + (parts[0] || 'home');
            const newId = parts[1] || null;

            let newPage = 1;
            if (paramsPart) {
                const params = new URLSearchParams(paramsPart);
                newPage = parseInt(params.get('p')) || 1;
            }

            setRoute(newRoute);
            setId(newId);
            setPage(newPage); // Aggiorna lo stato della pagina
            setSearchQuery('');
        };

        useEffect(() => {
            navigate(); // Inizializza al caricamento
            window.addEventListener('hashchange', navigate);
            return () => window.removeEventListener('hashchange', navigate);
        }, []);

        // FUNZIONE MODIFICATA: Aggiorna la URL Hash includendo il parametro di pagina
        const navigateTo = (route, id = null, newPage = 1) => {
            let newHash = route;

            if (id) {
                // Navigazione alla pagina di dettaglio (#archive/101)
                newHash = `${route}/${id}`;
            } else if (newPage > 1) {
                // Navigazione alla pagina di lista con parametro (?p=3)
                newHash = `${route}?p=${newPage}`;
            }

            window.location.hash = newHash;
        };
        
        // Recupera l'elemento da mostrare nel DetailPage
        const getItem = () => {
            if (!id) return null;
            const allItems = [...data.products, ...data.archive, ...data.library];
            return allItems.find(item => item.id === id);
        };
        
        const item = getItem();

        const renderPage = () => {
            if (loading) {
                return e('div', { className: 'text-center p-20' }, 'Caricamento dati...');
            }

            switch (route) {
                case '#product':
                    return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { 
                        items: data.products, 
                        navigateTo, 
                        page: '#product', 
                        options: dynamicFilterOptions.product, 
                        searchQuery: searchQuery,
                        initialPage: page, // Passa lo stato iniziale della pagina
                        setPage: setPage // Permette al ListPage di aggiornare lo stato dell'App
                    });
                case '#archive':
                    return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { 
                        items: data.archive, 
                        navigateTo, 
                        page: '#archive', 
                        options: dynamicFilterOptions.archive, 
                        searchQuery: searchQuery,
                        initialPage: page, // Passa lo stato iniziale della pagina
                        setPage: setPage // Permette al ListPage di aggiornare lo stato dell'App
                    });
                case '#library':
                    return id ? e(DetailPage, { item, navigateTo }) : e(ListPage, { 
                        items: data.library, 
                        navigateTo, 
                        page: '#library', 
                        options: dynamicFilterOptions.library, 
                        searchQuery: searchQuery,
                        initialPage: page, // Passa lo stato iniziale della pagina
                        setPage: setPage // Permette al ListPage di aggiornare lo stato dell'App
                    });
                case '#contact':
                    return e(ContactPage, { navigateTo });
                case '#home':
                default:
                    return e(HomePage, { navigateTo });
            }
        };
        
        const isHomePage = route === '#home' || route === '';

        return e('div', { key: route, className: 'animate-fade-in' },
            e(ScrollToTop, { currentRoute: route }), // Scrolla in cima ad ogni cambio di route
            !isHomePage && e(Header, { navigateTo, currentRoute: route, searchQuery: searchQuery, onSearchChange: setSearchQuery }),
            renderPage(),
            !isHomePage && e(Footer)
        );
    };
    
    // --- Avvio dell'applicazione ---
    const rootElement = document.getElementById('root');
    if (rootElement) {
        createRoot(rootElement).render(e(App));
    } else {
        console.error("L'elemento 'root' non è stato trovato nel DOM.");
    }
    </script>
</body>
</html>
