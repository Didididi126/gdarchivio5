<body class="antialiased">
    
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>

    <noscript>Per visualizzare questa applicazione, è necessario abilitare JavaScript.</noscript>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script>
    window.addEventListener('load', runApp);

    function runApp() {
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            console.error('React o ReactDOM non sono stati caricati.');
            return;
        }

        const { useState, useEffect, useMemo, useCallback, Fragment, useRef } = React;
        const { createRoot } = ReactDOM;
        const e = React.createElement;
        
        const forceScrollTop = () => {
            requestAnimationFrame(() => {
                window.scrollTo(0, 0);
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
            });
        };

        const createPlaceholderSvg = (title = "gdarchivio") => {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
                    <rect width="100%" height="100%" fill="#fafafa"/>
                    <rect x="20" y="20" width="760" height="760" fill="none" stroke="#e5e5e5" stroke-dasharray="6 6"/>
                    <text x="50%" y="48%" font-family="monospace" font-size="20" fill="#111" text-anchor="middle" letter-spacing="3" text-transform="uppercase" font-weight="bold">${title}</text>
                    <text x="50%" y="54%" font-family="monospace" font-size="12" fill="#999" text-anchor="middle" letter-spacing="2" text-transform="uppercase">image in archive</text>
                </svg>
            `;
            return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
        };

        const resolveImage = (imgSrc, title = "gdarchivio") => {
            if (!imgSrc || imgSrc.includes('placeholder') || imgSrc.includes('NOME_FOTO')) {
                return createPlaceholderSvg(title);
            }
            return imgSrc;
        };

        const generateFilterOptions = (products, libraryItems) => {
            const collectionItems = products.filter(p => p.type === 'product');
            const archiveItems = products.filter(p => p.type === 'archive');

            const getUniqueSortedValues = (items, key) => {
                const values = items
                    .map(item => item[key])
                    .filter(value => value !== null && value !== undefined && value !== ''); 
                
                const uniqueValues = [...new Set(values)];

                uniqueValues.sort((a, b) => {
                    if (key === 'year' && typeof a === 'number' && typeof b === 'number') {
                        return b - a; 
                    }
                    return String(a).localeCompare(String(b), undefined, { numeric: true });
                });
                
                return uniqueValues;
            };

            return {
                collection: {
                    brand: getUniqueSortedValues(collectionItems, 'brand'),
                    category: getUniqueSortedValues(collectionItems, 'category'),
                    color: getUniqueSortedValues(collectionItems, 'color'),
                    size: getUniqueSortedValues(collectionItems, 'size'),
                    year: getUniqueSortedValues(collectionItems, 'year'),
                },
                archive: {
                    brand: getUniqueSortedValues(archiveItems, 'brand'),
                    category: getUniqueSortedValues(archiveItems, 'category'),
                    color: getUniqueSortedValues(archiveItems, 'color'),
                    size: getUniqueSortedValues(archiveItems, 'size'),
                    year: getUniqueSortedValues(archiveItems, 'year'),
                },
                library: {
                    author: getUniqueSortedValues(libraryItems, 'author'),
                    category: getUniqueSortedValues(libraryItems, 'category'),
                    year: getUniqueSortedValues(libraryItems, 'year'),
                }
            };
        };

        const sortOptions = ['name a–z', 'name z–a', 'brand a-z', 'brand z-a', 'year old to new', 'year new to old'];
        
        const Icon = ({ name, size = 16, className = '' }) => {
            const iconProps = { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className: className };
            const icons = {
                Search: e('svg', iconProps, e('circle', { cx: '11', cy: '11', r: '8' }), e('line', { x1: '21', y1: '21', x2: '16.65', y2: '16.65' })),
                ChevronDown: e('svg', iconProps, e('path', { d: 'm6 9 6 6 6-6' })),
                ArrowLeft: e('svg', iconProps, e('path', { d: 'm12 19-7-7 7-7' }), e('path', { d: 'M19 12H5' })),
                ExternalLink: e('svg', iconProps, e('path', { d: 'M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6' }), e('polyline', { points: '15 3 21 3 21 9' }), e('line', { x1: '10', y1: '14', x2: '21', y2: '3' })),
                X: e('svg', iconProps, e('line', { x1: '18', y1: '6', x2: '6', y2: '18' }), e('line', { x1: '6', y1: '6', x2: '18', y2: '18' })),
                Filter: e('svg', iconProps, e('polygon', { points: '22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3' })),
                Menu: e('svg', iconProps, e('line', { x1: '3', y1: '12', x2: '21', y2: '12' }), e('line', { x1: '3', y1: '6', x2: '21', y2: '6' }), e('line', { x1: '3', y1: '18', x2: '21', y2: '18' })),
                Instagram: e('svg', iconProps, e('rect', { x: '2', y: '2', width: '20', height: '20', rx: '5', ry: '5' }), e('path', { d: 'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z' }), e('line', { x1: '17.5', y1: '6.5', x2: '17.51', y2: '6.5' })),
                Heart: e('svg', iconProps, e('path', { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'})),
                HeartFilled: e('svg', {...iconProps, fill: 'currentColor', stroke: 'currentColor'}, e('path', { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'})),
                Share: e('svg', iconProps, e('circle', {cx: '18', cy: '5', r: '3'}), e('circle', {cx: '6', cy: '12', r: '3'}), e('circle', {cx: '18', cy: '19', r: '3'}), e('line', {x1: '8.59', y1: '13.51', x2: '15.42', y2: '17.49'}), e('line', {x1: '15.41', y1: '6.51', x2: '8.59', y2: '10.49'})),
                Mail: e('svg', iconProps, e('path', { d: 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z' }), e('polyline', { points: '22,6 12,13 2,6' })),
                Maximize: e('svg', iconProps, e('path', { d: 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3' }))
            };
            return icons[name] || null;
        };

        const FilterDropdown = ({ label, values, isOpen, onToggle, selectedValues, onFilterChange }) => {
            return e('div', { className: 'relative' },
                e('button', {
                    onClick: onToggle,
                    className: 'flex items-center gap-2 font-martian-mono text-sm'
                },
                    label.toLowerCase(),
                    e(Icon, { name: 'ChevronDown', size: 14, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}` })
                ),
                isOpen && e('div', { className: 'absolute top-full left-0 mt-2 w-72 bg-white border rounded-lg shadow-xl animate-fade-in z-30' },
                    e('div', { className: 'max-h-80 overflow-y-auto p-2' },
                        values.map(option => e('label', {
                            key: option,
                            className: 'flex items-center w-full text-left px-4 py-2 font-martian-mono text-sm hover:bg-gray-100 cursor-pointer rounded-md'
                        },
                           e('input', { 
                               type: 'checkbox', 
                               className: 'hidden', 
                               checked: selectedValues.includes(String(option)),
                               onChange: () => onFilterChange(label, String(option))
                            }),
                           e('div', { className: `w-4 h-4 border border-gray-400 rounded-sm mr-3 flex-shrink-0 bg-white ${selectedValues.includes(String(option)) ? 'bg-black' : ''}` }),
                           String(option)
                        ))
                    )
                )
            );
        };
        
        const CustomSortDropdown = ({ options, selectedValue, onSelect, isOpen, onToggle }) => {
            return e('div', { className: 'relative' },
                e('button', {
                    onClick: onToggle,
                    className: 'flex items-center justify-between gap-2 font-martian-mono text-sm w-40 border-b border-gray-300 pb-1'
                },
                    selectedValue,
                    e(Icon, { name: 'ChevronDown', size: 14, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}` })
                ),
                isOpen && e('div', { className: 'absolute top-full right-0 mt-2 w-48 bg-white border rounded-lg shadow-xl animate-fade-in z-30' },
                    e('div', { className: 'p-2' },
                        options.map(option => e('button', {
                            key: option,
                            onClick: () => onSelect(option),
                            className: `block w-full text-left px-4 py-2 font-martian-mono text-sm rounded-md ${selectedValue === option ? 'bg-gray-100' : 'hover:bg-gray-100'}`
                        }, option))
                    )
                )
            );
        };
        
        const MobileFilterPanel = ({ options, initialFilters, selectedFilters, onApply, onClose }) => {
            const [tempFilters, setTempFilters] = useState(selectedFilters);
            const [openCategory, setOpenCategory] = useState(null);

            useEffect(() => {
                document.body.classList.add('modal-open');
                return () => {
                    document.body.classList.remove('modal-open');
                };
            }, []);

            const handleFilterChange = (filterType, value) => {
                setTempFilters(prev => {
                    const currentValues = prev[filterType] || [];
                    const newValues = currentValues.includes(value)
                        ? currentValues.filter(v => v !== value)
                        : [...currentValues, value];
                    return { ...prev, [filterType]: newValues };
                });
            };
            
            const handleReset = () => {
                setTempFilters(initialFilters);
            };
            
            const handleApply = () => {
                onApply(tempFilters);
                onClose();
            };
            
            const totalSelections = useMemo(() => {
                return Object.values(tempFilters).reduce((sum, arr) => sum + arr.length, 0);
            }, [tempFilters]);

            const AccordionItem = ({ label, values }) => {
                const isOpen = openCategory === label;
                return e('div', { className: 'border-b' },
                    e('button', { 
                        onClick: () => setOpenCategory(isOpen ? null : label),
                        className: 'w-full flex justify-between items-center py-4 px-4'
                    },
                        e('span', { className: 'font-martian-mono uppercase' }, label),
                        e(Icon, { name: 'ChevronDown', size: 20, className: `transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`})
                    ),
                    isOpen && e('div', { className: 'px-4 pb-4 max-h-60 overflow-y-auto'},
                        values.map(option => e('label', {
                            key: option,
                            className: 'flex items-center w-full text-left py-2 font-martian-mono text-sm hover:bg-gray-100 cursor-pointer rounded-md'
                        },
                           e('input', { type: 'checkbox', className: 'hidden', checked: (tempFilters[label] || []).includes(String(option)), onChange: () => handleFilterChange(label, String(option)) }),
                           e('div', { className: `w-5 h-5 border border-gray-400 rounded-sm mr-3 flex-shrink-0 bg-white ${(tempFilters[label] || []).includes(String(option)) ? 'bg-black' : ''}` }),
                           String(option)
                        ))
                    )
                );
            };

            return e('div', { className: 'fixed inset-0 z-50' },
                e('div', { className: 'absolute inset-0 bg-black bg-opacity-50', onClick: onClose }),
                e('div', { className: 'absolute top-0 right-0 bottom-0 h-full bg-white w-full max-w-sm flex flex-col animate-slide-in-right' },
                    e('header', { className: 'flex items-center justify-between p-4 border-b' },
                        e('h3', { className: 'font-martian-mono text-lg font-bold uppercase' }, 'FILTER'),
                        e('button', { onClick: onClose }, e(Icon, { name: 'X', size: 24 }))
                    ),
                    e('main', { className: 'flex-1 overflow-y-auto' },
                        Object.entries(options).map(([label, values]) => e(AccordionItem, { key: label, label, values }))
                    ),
                    e('footer', { className: 'p-4 border-t flex items-center gap-4' },
                        e('button', { onClick: handleReset, className: 'font-martian-mono uppercase underline' }, 'Reset'),
                        e('button', { onClick: handleApply, className: 'flex-1 bg-black text-white py-3 font-martian-mono uppercase tracking-wider text-sm' }, `Mostra risultati (${totalSelections})`)
                    )
                )
            );
        };

        const Header = ({ navigateTo, currentRoute, searchQuery, onSearchChange, wishlistCount }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navItems = [
                { label: 'Collection', page: '#collection' },
                { label: 'Archive', page: '#archive' },
                { label: 'Library', page: '#library' },
                { label: 'Contact', page: '#contact' }
            ];

            const navigateAndClose = (path) => {
                navigateTo(path, null, { resetPage: true });
                setIsMenuOpen(false);
            };

            useEffect(() => {
                if (isMenuOpen) {
                    document.body.classList.add('modal-open');
                } else {
                    document.body.classList.remove('modal-open');
                }
                return () => {
                    document.body.classList.remove('modal-open');
                };
            }, [isMenuOpen]);

            return e(Fragment, null, 
                e('header', { className: 'sticky top-0 bg-white bg-opacity-80 backdrop-blur-sm border-b border-gray-200 z-40' },
                    e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                        e('div', { className: 'flex items-center justify-between h-20' },
                            e('a', { href: '#home', onClick: (ev) => { ev.preventDefault(); navigateAndClose('#home'); }, className: 'flex items-center gap-3' },
                                e('img', { 
                                    src: './images/logo-icona.webp', 
                                    alt: 'gdarchivio icona', 
                                    className: 'w-8 h-8 rounded-full object-cover',
                                    onError: (ev) => { ev.target.src = createPlaceholderSvg("GD"); }
                                }),
                                e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                            ),
                            e('div', { className: 'hidden md:flex items-center gap-x-8 ml-auto' },
                                e('nav', { className: 'flex items-center space-x-8' },
                                    navItems.map(item => e('a', {
                                        key: item.label,
                                        href: item.page,
                                        onClick: (ev) => { ev.preventDefault(); navigateTo(item.page, null, { resetPage: true }); },
                                        className: `font-martian-mono uppercase tracking-wider text-sm ${currentRoute.startsWith(item.page) ? 'font-bold' : 'font-normal'} hover:font-bold transition-all`
                                    }, item.label))
                                ),
                                e('a', {
                                    href: '#wishlist',
                                    onClick: (ev) => { ev.preventDefault(); navigateTo('#wishlist', null, { resetPage: true }); },
                                    className: `relative text-black hover:opacity-70 transition-opacity flex items-center ${currentRoute === '#wishlist' ? 'scale-110 font-bold' : ''}`
                                },
                                    e(Icon, { name: wishlistCount > 0 ? 'HeartFilled' : 'Heart', size: 18 }),
                                    wishlistCount > 0 && e('span', { className: 'ml-1.5 text-xs font-martian-mono font-bold' }, `(${wishlistCount})`)
                                ),
                                e('div', { className: 'relative' },
                                    e('input', { 
                                        type: 'text', 
                                        placeholder: 'search', 
                                        className: 'border-b border-gray-300 py-1.5 pl-0 pr-8 w-36 text-sm focus:outline-none focus:border-black font-martian-mono placeholder-cold-gray bg-transparent',
                                        value: searchQuery,
                                        onChange: (ev) => onSearchChange(ev.target.value)
                                    }),
                                    e('div', { className: 'absolute inset-y-0 right-0 flex items-center pr-1 pointer-events-none' }, e(Icon, { name: 'Search', size: 16, className: 'text-gray-400' }))
                                )
                            ),
                            e('div', { className: 'flex items-center gap-4 md:hidden ml-auto' },
                                e('a', {
                                    href: '#wishlist',
                                    onClick: (ev) => { ev.preventDefault(); navigateAndClose('#wishlist'); },
                                    className: 'relative text-black flex items-center'
                                },
                                    e(Icon, { name: wishlistCount > 0 ? 'HeartFilled' : 'Heart', size: 20 }),
                                    wishlistCount > 0 && e('span', { className: 'ml-1 text-xs font-martian-mono font-bold' }, wishlistCount)
                                ),
                                e('button', { onClick: () => setIsMenuOpen(!isMenuOpen) },
                                    e(Icon, { name: isMenuOpen ? 'X' : 'Menu', size: 24 })
                                )
                            )
                        )
                    )
                ),
                isMenuOpen && e('div', { className: 'fixed inset-0 bg-white z-50 p-4 animate-fade-in md:hidden' },
                    e('div', { className: 'flex justify-between items-center mb-12'},
                        e('a', { href: '#home', onClick: (ev) => { ev.preventDefault(); navigateAndClose('#home'); }, className: 'flex items-center gap-3' },
                            e('img', { 
                                src: './images/logo-icona.webp', 
                                alt: 'gdarchivio icona', 
                                className: 'w-8 h-8 rounded-full object-cover',
                                onError: (ev) => { ev.target.src = createPlaceholderSvg("GD"); }
                            }),
                            e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                        ),
                        e('button', { className: 'md:hidden', onClick: () => setIsMenuOpen(false) },
                            e(Icon, { name: 'X', size: 24 })
                        )
                    ),
                    e('nav', { className: 'flex flex-col items-center justify-center space-y-8' },
                         navItems.map(item => e('a', {
                            key: item.label,
                            href: item.page,
                            onClick: (ev) => { ev.preventDefault(); navigateAndClose(item.page); },
                            className: 'font-martian-mono uppercase tracking-wider text-2xl'
                        }, item.label)),
                        e('a', {
                            href: '#wishlist',
                            onClick: (ev) => { ev.preventDefault(); navigateAndClose('#wishlist'); },
                            className: 'font-martian-mono uppercase tracking-wider text-2xl flex items-center gap-2'
                        }, e(Icon, { name: 'HeartFilled', size: 20 }), `Saved (${wishlistCount})`)
                    )
                )
            );
        };

        const Footer = ({ navigateTo }) => {
             return e('footer', { className: 'bg-white' },
                e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                    e('div', { className: 'py-12 text-left border-t border-gray-200' },
                        e('a', { 
                            href: '#home', 
                            onClick: (ev) => { ev.preventDefault(); navigateTo('#home', null, { resetPage: true }); },
                            className: 'flex items-center gap-3 mb-6' 
                        },
                            e('img', { 
                                src: './images/logo-icona.webp', 
                                alt: 'gdarchivio icona', 
                                className: 'w-8 h-8 rounded-full object-cover',
                                onError: (ev) => { ev.target.src = createPlaceholderSvg("GD"); }
                            }),
                            e('span', { className: 'font-bitcount-single font-medium text-4xl' }, 'gdarchivio')
                        ),
                        e('p', { className: 'font-martian-mono text-sm text-dark-gray max-w-md' }, 'digital fashion archive. authentic pieces from the world\'s most iconic maisons.'),
                        e('a', {
                            href: 'https://www.instagram.com/gdarchivio',
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            className: 'font-martian-mono text-sm uppercase tracking-wider mt-6 inline-block hover:underline'
                        }, 'Instagram')
                    )
                ),
                e('div', { className: 'border-t border-gray-200' },
                    e('div', { className: 'container mx-auto px-4 sm:px-6 lg:px-8' },
                         e('p', { className: 'text-center font-martian-mono text-xs text-cold-gray py-8' }, '© 2025 GDARCHIVIO. ALL RIGHTS RESERVED.')
                    )
                )
            );
        };
        
        const FilterBar = ({ options, initialFilters, selectedFilters, onFilterChange, onResetFilters, onApplyFilters, sortOrder, onSortChange }) => {
            const [openFilter, setOpenFilter] = useState(null);
            const [isPanelOpen, setIsPanelOpen] = useState(false);
            const barRef = useRef(null);
            
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (barRef.current && !barRef.current.contains(event.target)) {
                        setOpenFilter(null);
                    }
                };

        const ListPage = ({ items, navigateTo, page, options, searchQuery }) => {

            });

            const initialFilters = useMemo(() => Object.keys(options).reduce((acc, key) => ({ ...acc, [key]: [] }), {}), [options]);
            const [selectedFilters, setSelectedFilters] = useState(initialFilters);

            const itemsPerPage = 12;

                sessionStorage.setItem(page, currentPage);
                forceScrollTop();
            }, [currentPage, page]);

            const queryStateRef = useRef({ filters: selectedFilters, search: searchQuery });

            useEffect(() => {
                const hasFiltersChanged = JSON.stringify(queryStateRef.current.filters) !== JSON.stringify(selectedFilters);

                    const newValues = currentValues.includes(value)
                        ? currentValues.filter(v => v !== value)
                        : [...currentValues, value];
                    return { ...prevFilters, [filterType]: newValues };
                });
            }, []);
            
            const handleResetFilters = useCallback(() => {
                setSelectedFilters(initialFilters);
            }, [initialFilters]);

            const handleApplyFilters = useCallback((newFilters) => {
                setSelectedFilters(newFilters);
            }, []);
            
            const processedItems = useMemo(() => {
                let filtered = items.filter(item => {
                    const filterMatch = Object.entries(selectedFilters).every(([key, values]) => {
                        if (values.length === 0) return true;
                        const itemValue = item[key] || (key === 'author' && item.brand);
                        return values.includes(String(itemValue));
                    });

                    if (!filterMatch) return false;

                    if (!searchQuery) return true;
                    const query = searchQuery.toLowerCase();
                    const nameMatch = (item.name || '').toLowerCase().includes(query);
                    const brandMatch = (item.brand || '').toLowerCase().includes(query);
                    const authorMatch = (item.author || '').toLowerCase().includes(query);
                    const descriptionMatch = (item.description || '').toLowerCase().includes(query);
                    
                    return nameMatch || brandMatch || authorMatch || descriptionMatch;
                });

                const [field, orderPart1, orderPart2] = sortOrder.split(' ');
                const order = `${orderPart1} ${orderPart2}`;
                const sortKey = field === 'name' ? 'name' : (field === 'brand' ? 'brand' : 'year');

                filtered.sort((a, b) => {
                    const valA = a[sortKey];
                    const valB = b[sortKey];
                    let comparison = 0;
                    if (typeof valA === 'string') {
                        comparison = valA.localeCompare(valB);
                    } else if (typeof valA === 'number') {
                        comparison = valA - valB;
                    }
                    return order.includes('a-z') || order.includes('old') ? comparison : comparison * -1;
                });

                return filtered;

                        })
                      )
                    : e('div', { className: 'text-center py-24' },
                        e('p', { className: 'font-martian-mono text-base font-bold mb-2' }, 'Your wishlist is empty'),
                        e('p', { className: 'font-martian-mono text-sm text-cold-gray mb-6' }, 'Explore our archive and save your favorite pieces.'),
                        e('button', {
                            onClick: () => navigateTo('#collection', null, { resetPage: true }),
                            className: 'font-martian-mono uppercase border border-black px-6 py-2.5 text-xs hover:bg-black hover:text-white transition-colors'
                        }, 'Browse Collection')
                      )
            );
        };
        
        const DetailPage = ({ item, navigateTo, wishlist, onToggleWishlist }) => {
            const [modal, setModal] = useState(null);
            const [currentImageIndex, setCurrentImageIndex] = useState(0); 
            const [isLightboxOpen, setIsLightboxOpen] = useState(false);
            const [shareFeedback, setShareFeedback] = useState('');
            
            const touchStartX = useRef(null);
            const touchEndX = useRef(null);

            const isSold = Boolean(item.sold && item.type === 'product');
            const displayTitle = item.brand || item.author || "gdarchivio";
            const imagesList = (item.images && item.images.length > 0) ? item.images : [createPlaceholderSvg(displayTitle)];

            const goToPreviousImage = () => {
                const isFirstImage = currentImageIndex === 0;
                const newIndex = isFirstImage ? imagesList.length - 1 : currentImageIndex - 1;
                setCurrentImageIndex(newIndex);
            };

            const goToNextImage = () => {
                const isLastImage = currentImageIndex === imagesList.length - 1;
                const newIndex = isLastImage ? 0 : currentImageIndex + 1;
                setCurrentImageIndex(newIndex);
            };

            const handleTouchStart = (e) => {
                touchEndX.current = null;
                touchStartX.current = e.targetTouches[0].clientX;
            };

            const handleTouchMove = (e) => {
                touchEndX.current = e.targetTouches[0].clientX;
            };

            const handleTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                const isLeftSwipe = distance > 45;
                const isRightSwipe = distance < -45;

                if (isLeftSwipe && imagesList.length > 1) {
                    goToNextImage();
                }
                if (isRightSwipe && imagesList.length > 1) {
                    goToPreviousImage();
                }
            };

            useEffect(() => {
                setCurrentImageIndex(0);
            }, [item]);

            const handleShare = async () => {
                const shareUrl = window.location.href;
                const shareTitle = `gdarchivio | ${item.name}`;

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: shareTitle,
                            url: shareUrl
                        });
                        return;
                    } catch (err) {
                        if (err.name === 'AbortError') return;
                    }
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                        setShareFeedback('LINK COPIED!');
                        setTimeout(() => setShareFeedback(''), 2500);
                        return;
                    } catch (e) {}
                }

                window.prompt("Copy link:", shareUrl);
            };
            
            const isWishlisted = wishlist.includes(item.id);
            const isLibraryType = item.type === 'book' || item.type === 'catalogue' || item.type === 'vhs' || item.type === 'album';
            const pageType = isLibraryType ? 'library' : (item.type === 'product' ? 'collection' : 'archive');
            const goBackUrl = `#${pageType}`;
            const backButtonText = `Back to ${pageType}`;

            const renderDetails = () => {
                const details = [ 
                    { label: 'category', value: item.category }, 
                    { label: 'color', value: item.color }, 
                    { label: 'size', value: item.size }, 
                    { label: 'year', value: item.year }, 
                    { label: 'condition', value: item.condition }, 
                    { label: 'material', value: item.material }, 
                    { label: 'author', value: item.author }, 
                    { label: 'publisher', value: item.publisher }
                ];
                return details
                    .filter(d => d.value && d.value !== "..." && d.value !== null)
                    .map(d => 
                        e('div', { key: d.label, className: 'flex justify-between text-sm py-2' },
                            e('span', { className: 'font-martian-mono text-cold-gray' }, d.label.toLowerCase()),
                            e('span', { className: 'font-martian-mono' }, d.value)
                        )
                    );
            };

            const renderMeasurements = () => {
                if (!item.measurements || Object.keys(item.measurements).length === 0) return null;
                const validMeasurements = Object.entries(item.measurements).filter(([_, v]) => v && v !== "...");
                if (validMeasurements.length === 0) return null;

                return validMeasurements.map(([key, value]) => 
                    e('div', { key: key, className: 'flex justify-between text-sm py-2' },
                        e('span', { className: 'font-martian-mono text-cold-gray' }, key.toLowerCase()),
                        e('span', { className: 'font-martian-mono' }, value)
                    )
                );
            };

            const renderActionButtons = () => {
                if (isSold) {
                    return e('div', { className: 'mt-6 p-4 bg-gray-100 text-center font-martian-mono uppercase tracking-wider text-sm text-cold-gray font-bold' }, 'Item Sold Out');
                }

                const buttons = [];
                if (item.type === 'archive' || isLibraryType) {
                    buttons.push(e('button', { key: 'inquiry', onClick: () => setModal('inquiry'), className: 'w-full bg-black text-white py-3 font-martian-mono uppercase tracking-wider text-sm hover:bg-dark-gray transition-colors' }, 'Contact for Inquiry'));
                }
                if (item.type === 'product') {
                     buttons.push(e('button', { key: 'inquiry', onClick: () => setModal('inquiry'), className: 'w-full bg-black text-white py-3 font-martian-mono uppercase tracking-wider text-sm hover:bg-dark-gray transition-colors' }, 'Contact for Inquiry'));
                     if (item.purchaseLinks && Object.keys(item.purchaseLinks).length > 0) {
                         buttons.push(e('button', { key: 'platforms', onClick: () => setModal('platforms'), className: 'w-full border border-black text-black py-3 font-martian-mono uppercase tracking-wider text-sm hover:bg-gray-100 transition-colors' }, 'Available On Platforms'));
                     }
                }
                return e('div', { className: 'mt-6 space-y-2' }, ...buttons);
            };

            const mainImgSrc = resolveImage(imagesList[currentImageIndex], displayTitle);

            return e(Fragment, null,
                e('main', { className: 'container mx-auto px-4 sm:px-6 lg:px-8 py-8' },
                    e('a', { 
                        href: goBackUrl, 
                        onClick: (ev) => { ev.preventDefault(); navigateTo(goBackUrl); },
                        className: 'flex items-center gap-2 font-martian-mono text-sm uppercase text-cold-gray hover:text-black mb-6' 
                    }, e(Icon, { name: 'ArrowLeft', size: 16 }), backButtonText),
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12' },
                        e('div', { className: 'flex flex-col gap-4' },
                             e('div', { 
                                className: 'flex-1 aspect-square relative select-none cursor-zoom-in',
                                onTouchStart: handleTouchStart,
                                onTouchMove: handleTouchMove,
                                onTouchEnd: handleTouchEnd,
                                onClick: () => setIsLightboxOpen(true)
                             },
                                e('img', { 
                                    src: mainImgSrc, 
                                    alt: item.name, 
                                    loading: 'lazy',
                                    onError: (ev) => { ev.target.src = createPlaceholderSvg(displayTitle); },
                                    className: 'w-full h-full object-contain pointer-events-none' 
                                }),
                                
                                isSold && e('div', {
                                    className: 'absolute top-4 right-4 bg-black text-white text-sm font-martian-mono font-bold px-3 py-1.5 tracking-wider uppercase'
                                }, 'SOLD'),

                                e('div', {
                                    className: 'absolute bottom-3 left-3 bg-white/80 backdrop-blur-sm text-black text-xs font-martian-mono px-2.5 py-1 rounded'
                                }, `${currentImageIndex + 1} / ${imagesList.length}`),

                                e('div', {
                                    className: 'absolute bottom-3 right-3 bg-white/80 backdrop-blur-sm p-1.5 rounded hover:bg-white transition-all text-black'
                                }, e(Icon, { name: 'Maximize', size: 14 })),

                                imagesList.length > 1 && e(Fragment, null,
                                    e('button', { 
                                        onClick: (e) => { e.stopPropagation(); goToPreviousImage(); }, 
                                        className: 'hidden md:block absolute top-1/2 left-2 -translate-y-1/2 bg-white/70 p-2 rounded-full hover:bg-white transition-all shadow' 
                                    }, e(Icon, { name: 'ArrowLeft', size: 24 })),
                                    e('button', { 
                                        onClick: (e) => { e.stopPropagation(); goToNextImage(); }, 
                                        className: 'hidden md:block absolute top-1/2 right-2 -translate-y-1/2 bg-white/70 p-2 rounded-full hover:bg-white transition-all shadow' 
                                    }, e(Icon, { name: 'ArrowLeft', size: 24, className: 'transform rotate-180' }))
                                )
                            )
                        ),
                        e('div', { className: 'sticky top-24 self-start z-10' },
                            e('div', { className: 'pb-6 border-b border-gray-100 flex justify-between items-start' },
                                e('div', null,
                                    e('h2', { className: 'font-martian-mono text-base uppercase text-cold-gray' }, item.brand || item.author),
                                    e('h1', { className: 'font-martian-mono text-xl uppercase mt-1' }, item.name)
                                ),
                                e('div', { className: 'flex items-center gap-x-3' },
                                    e('span', { className: `text-xs font-bold text-black transition-opacity duration-300 ${shareFeedback ? 'opacity-100' : 'opacity-0'}` }, shareFeedback),
                                    e('button', { onClick: () => onToggleWishlist(item.id), className: isWishlisted ? 'text-black' : 'text-cold-gray hover:text-black' }, 
                                        e(Icon, { name: isWishlisted ? 'HeartFilled' : 'Heart', size: 20 })
                                    ),
                                    e('button', { onClick: handleShare, className: 'text-cold-gray hover:text-black' }, 
                                        e(Icon, { name: 'Share', size: 20 })
                                    )
                                )
                            ),
                            e('div', { className: 'py-6 border-b border-gray-100' },
                                e('h4', { className: 'font-martian-mono text-sm uppercase font-bold mb-2' }, 'DESCRIPTION'),
                                e('p', { className: 'font-martian-mono text-sm leading-relaxed' }, item.description)
                            ),
                            e('div', { className: 'py-6 border-b border-gray-100' },
                                e('h4', { className: 'font-martian-mono text-sm uppercase font-bold mb-2' }, 'PRODUCT DETAILS'),
                                renderDetails()
                            ),
                            renderMeasurements() && e('div', { className: 'py-6' },
                                e('h4', { className: 'font-martian-mono text-sm uppercase font-bold mb-2' }, 'MEASUREMENTS'),
                                renderMeasurements()
                            ),
                            renderActionButtons(),
                            e('ul', { className: 'mt-6 space-y-1 text-xs text-cold-gray font-martian-mono list-disc list-outside pl-4' },
                                e('li', null, 'all products are carefully authenticated'),
                                e('li', null, 'detailed condition reports available'),
                                e('li', null, 'archive consultation by appointment')
                            )
                        )
                    )
                ),
                e(Modal, { isOpen: modal === 'inquiry', onClose: () => setModal(null), title: 'PRODUCT INQUIRY' }, e(InquiryForm, { item })),
                e(Modal, { isOpen: modal === 'platforms', onClose: () => setModal(null), title: 'AVAILABLE ON' }, e(PlatformsList, { item })),
                e(Lightbox, {
                    isOpen: isLightboxOpen,
                    onClose: () => setIsLightboxOpen(false),
                    images: imagesList,
                    currentIndex: currentImageIndex,
                    onPrev: goToPreviousImage,
                    onNext: goToNextImage,
                    onTouchStart: handleTouchStart,
                    onTouchEnd: handleTouchEnd,
                    itemTitle: displayTitle
                })
            );
        };
        
        const ContactPage = ({ navigateTo }) => {
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (event) => {
                event.preventDefault();
                const formData = new FormData(event.target);
                
                fetch("/", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams(formData).toString(),
                })
                .then(() => setSubmitted(true))
                .catch((error) => alert(error));
            };

            const FormInput = ({ id, label, type = 'text', placeholder }) => e('div', { className: 'mb-4' },
                e('label', { htmlFor: id, className: 'block font-martian-mono text-xs uppercase mb-1' }, e('span', null, label, e('span', {className: 'text-red-500'}, '*'))),
                e('input', { type, id, name: id, required: true, placeholder, className: 'w-full border-b border-gray-300 p-1 text-sm focus:outline-none focus:border-black font-martian-mono bg-transparent placeholder-cold-gray' })
            );

            const FormTextarea = ({ id, label, placeholder }) => e('div', { className: 'mb-4' },
                e('label', { htmlFor: id, className: 'block font-martian-mono text-xs uppercase mb-1' }, e('span', null, label, e('span', {className: 'text-red-500'}, '*'))),
                e('textarea', { id, name: id, required: true, rows: 4, placeholder, className: 'w-full border-b border-gray-300 p-1 text-sm focus:outline-none focus:border-black font-martian-mono bg-transparent placeholder-cold-gray resize-none' })
            );

            const FormSelect = ({ id, label, children }) => e('div', { className: 'mb-4' },
                 e('label', { htmlFor: id, className: 'block font-martian-mono text-xs uppercase mb-1' }, e('span', null, label, e('span', {className: 'text-red-500'}, '*'))),
                 e('select', {id, name: id, required: true, className: 'w-full border-b border-gray-300 p-1 text-sm focus:outline-none focus:border-black bg-white font-martian-mono pr-6 appearance-none'}, children)
            );
            
            const successMessage = e('div', null, 
                e('h3', { className: 'font-martian-mono text-lg font-bold uppercase mb-4' }, 'MESSAGE SENT!'),
                e('p', { className: 'font-martian-mono' }, 'Thank you for getting in touch. We will get back to you shortly.')
            );

            return e('main', { className: 'container mx-auto px-4 sm:px-6 lg:px-8 py-12' },
                 e('h2', { className: 'font-martian-mono uppercase font-bold text-xl mb-1' }, 'CONTACT'),
                 e('p', { className: 'font-martian-mono text-sm text-dark-gray' }, 'questions about a specific piece? want more information? we\'re here to help.'),
                 e('div', { className: 'border-b border-gray-200 mt-4 mb-10' }),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-x-12' },
                    e('div', { className: 'mb-12 md:mb-0' },
                        submitted ? successMessage : e(Fragment, null,
                            e('h3', { className: 'font-martian-mono text-lg font-bold uppercase mb-4' }, 'SEND A MESSAGE'),
                            e('form', { name: "contact", "data-netlify": "true", onSubmit: handleSubmit },
                                e('input', { type: 'hidden', name: 'form-name', value: 'contact' }),
                                e(FormInput, { id: 'name', label: 'Name', placeholder: 'your full name' }),
                                e(FormInput, { id: 'email', label: 'Email', type: 'email', placeholder: 'your.email@example.com' }),
                                e(FormSelect, { id: 'subject', label: 'Subject' },
                                    e('option', { value: '' }, 'select message subject'),
                                    e('option', { value: 'inquiry' }, 'product inquiry'),
                                    e('option', { value: 'research' }, 'research request'),
                                    e('option', { value: 'other' }, 'other')
                                ),
                                e(FormTextarea, { id: 'message', label: 'Message', placeholder: 'write your message here…' }),
                                e('button', { type: 'submit', className: 'bg-black text-white py-3 px-8 font-martian-mono uppercase tracking-wider text-sm font-bold hover:bg-dark-gray transition-colors' }, 'SEND MESSAGE')
                            )
                        )
                    ),
                    e('div', null,
                         e('h3', { className: 'font-martian-mono text-lg font-bold uppercase mb-4' }, 'GET IN TOUCH'),
                        e('div', { className: 'pb-8 mb-8 border-b border-gray-100' },
                            e('div', {className: 'flex items-center gap-2 mb-1'},
                                e(Icon, {name: 'Mail', size: 16, className: 'text-cold-gray'}),
                                e('p', { className: 'font-martian-mono text-xs uppercase text-cold-gray' }, 'Email')
                            ),
                            e('p', { className: 'font-martian-mono text-sm' }, e('a', { href: 'mailto:info@gdarchivio.com', className: 'underline' }, 'info@gdarchivio.com')),
                        ),
                        e('div', { className: 'pb-8 mb-8 border-b border-gray-100' },
                           e('h4', { className: 'font-martian-mono uppercase font-bold text-sm mb-2' }, 'Follow Us'),
                           e('a', {href: 'https://www.instagram.com/gdarchivio', target: '_blank', rel: 'noopener noreferrer', className: 'flex items-center gap-2 text-sm font-martian-mono'}, e(Icon, {name: 'Instagram'}), 'Instagram')
                        ),
                        e('div', null,
                            e('h4', { className: 'font-martian-mono uppercase font-bold text-sm mb-4' }, 'Frequently Asked'),
                            e('div', { className: 'space-y-4' },
                                e('div', null,
                                  e('p', { className: 'font-martian-mono text-sm font-bold' }, 'IS THIS AN ONLINE ARCHIVE ONLY?'),
                                  e('p', { className: 'font-martian-mono text-sm mt-1 text-dark-gray' }, 'yes, gdarchivio operates as a digital fashion archive. Consultations and viewing can be arranged by appointment.')
                                ),
                                e('div', null,
                                  e('p', { className: 'font-martian-mono text-sm font-bold' }, 'CAN I CONTRIBUTE TO THE ARCHIVE?'),
                                  e('p', { className: 'font-martian-mono text-sm mt-1 text-dark-gray' }, 'we welcome contributions from collectors and fashion enthusiasts. Contact us to discuss adding pieces to our archive.')
                                )
                            )
                        )
                    )
                )
            );
        };

        const App = () => {
            const [route, setRoute] = useState(window.location.hash || '#home');
            const [products, setProducts] = useState([]);
            const [libraryItems, setLibraryItems] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [dynamicFilterOptions, setDynamicFilterOptions] = useState(null);
            const [wishlist, setWishlist] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('wishlist')) || [];
                } catch (e) {
                    return [];
                }
            });

            const handleToggleWishlist = useCallback((itemId) => {
                setWishlist(prev => {
                    const newWishlist = prev.includes(itemId)
                        ? prev.filter(id => id !== itemId)
                        : [...prev, itemId];
                    localStorage.setItem('wishlist', JSON.stringify(newWishlist));
                    return newWishlist;
                });
            }, []);

            useEffect(() => {
                Promise.all([
                    fetch('./products.json').then(res => res.json()),
                    fetch('./library.json').then(res => res.json())
                ]).then(([productData, libraryData]) => {
                    setProducts(productData);
                    setLibraryItems(libraryData);
                    setDynamicFilterOptions(generateFilterOptions(productData, libraryData));
                }).catch(error => console.error("Errore nel caricamento dei dati JSON:", error));
            }, []);

            useEffect(() => {
                const handleHashChange = () => {
                    setRoute(window.location.hash || '#home');
                    forceScrollTop();
                };
                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);
            
            const navigateTo = useCallback((path, item = null, options = {}) => {
                const newRoute = item ? `${path}/${item.id}` : path;

                if (options.resetPage) {
                    sessionStorage.removeItem(path);
                }
                
                if (window.location.hash !== newRoute) {
                  window.history.pushState(null, '', newRoute);
                }
                setRoute(newRoute);
                forceScrollTop();
            }, []);

            const renderPage = () => {
                if (!dynamicFilterOptions) {
                    return e('div', { className: 'flex justify-center items-center h-screen' }, 
                        e('p', { className: 'font-martian-mono' }, 'Loading archive...')
                    );
                }

                const [page, id] = route.substring(1).split('/');
                const allItems = [...products, ...libraryItems];
                const item = allItems.find(p => p.id === id);

                if (id && !item && (products.length > 0 || libraryItems.length > 0)) {
                    navigateTo(page.startsWith('#') ? page : `#${page}`);
                    return null;
                }
                
                if (!item && id) {
                    return e('div', { className: 'text-center p-8' }, 'Loading item...');
                }

                switch (page) {
                    case 'collection':
                        return id ? e(DetailPage, { item, navigateTo, wishlist, onToggleWishlist: handleToggleWishlist }) : e(ListPage, { items: products.filter(p => p.type === 'product'), navigateTo, page: '#collection', options: dynamicFilterOptions.collection, searchQuery: searchQuery });
                    case 'archive':
                        return id ? e(DetailPage, { item, navigateTo, wishlist, onToggleWishlist: handleToggleWishlist }) : e(ListPage, { items: products.filter(p => p.type === 'archive'), navigateTo, page: '#archive', options: dynamicFilterOptions.archive, searchQuery: searchQuery });
                    case 'library':
                        return id ? e(DetailPage, { item, navigateTo, wishlist, onToggleWishlist: handleToggleWishlist }) : e(ListPage, { items: libraryItems, navigateTo, page: '#library', options: dynamicFilterOptions.library, searchQuery: searchQuery });
                    case 'wishlist':
                        const wishlistItems = allItems.filter(p => wishlist.includes(p.id));
                        return e(WishlistPage, { items: wishlistItems, navigateTo, onToggleWishlist: handleToggleWishlist });
                    case 'contact':
                        return e(ContactPage, { navigateTo });
                    case 'home':
                    default:
                        return e(HomePage, { navigateTo, products, libraryItems });
                }
            };
            
            const isHomePage = route === '#home' || route === '';

            return e('div', { key: route, className: 'relative min-h-screen' }, 
                !isHomePage && e(Header, { navigateTo, currentRoute: route, searchQuery: searchQuery, onSearchChange: setSearchQuery, wishlistCount: wishlist.length }),
                renderPage(),
                !isHomePage && e(Footer, { navigateTo }),
                e(CookieBanner)
            );
        };
        
        const rootElement = document.getElementById('root');
        if (rootElement) {
            createRoot(rootElement).render(e(App));
        } else {
            console.error("L'elemento 'root' non è stato trovato nel DOM.");
        }
    }
    </script>
</body>
</html>
