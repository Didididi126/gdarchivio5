<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gdarchivio online</title>
    <link rel="icon" type="image/png" href="https://placehold.co/32x32/000000/FFFFFF/png?text=GD" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@400;500&family=Martian+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Martian Mono', monospace; background-color: #ffffff; color: #000000; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: #f1f1f1; } ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: #555; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes slideInFromRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .animate-slide-in-right { animation: slideInFromRight 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        .font-bitcount-single { font-family: 'Bitcount Single', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body.modal-open {
            overflow: hidden;
        }

        /* Nuova Galleria Swipe */
        .snap-x { scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .snap-center { scroll-snap-align: center; }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { 
              'martian-mono': ['"Martian Mono"', 'monospace'], 
              'bitcount-single': ['"Bitcount Single"', 'monospace'], 
            },
            colors: { 
              'dark-gray': '#333333', 
              'cold-gray': '#888888', 
            }
          }
        }
      };
    </script>
</head>
<body class="antialiased">
    
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="subject"></select>
      <textarea name="message"></textarea>
    </form>
    <form name="inquiry" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <input type="text" name="product-inquiry" />
    </form>
    
    <noscript>Per visualizzare questa applicazione, è necessario abilitare JavaScript.</noscript>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <script>
    window.addEventListener('load', runApp);

    function runApp() {
        if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
            console.error('React o ReactDOM non sono stati caricati.');
            return;
        }

        const { useState, useEffect, useMemo, useCallback, Fragment, useRef } = React;
        const { createRoot } = ReactDOM;
        const e = React.createElement;
        
        // --- Utility e Filtri (Tua logica originale) ---
        const generateFilterOptions = (products, libraryItems) => {
            const collectionItems = products.filter(p => p.type === 'product');
            const archiveItems = products.filter(p => p.type === 'archive');

            const getUniqueSortedValues = (items, key) => {
                const values = items
                    .map(item => item[key])
                    .filter(value => value !== null && value !== undefined && value !== ''); 
                const uniqueValues = [...new Set(values)];
                uniqueValues.sort((a, b) => {
                    if (key === 'year' && typeof a === 'number' && typeof b === 'number') return b - a; 
                    return String(a).localeCompare(String(b), undefined, { numeric: true });
                });
                return uniqueValues;
            };

            return {
                collection: {
                    brand: getUniqueSortedValues(collectionItems, 'brand'),
                    category: getUniqueSortedValues(collectionItems, 'category'),
                    color: getUniqueSortedValues(collectionItems, 'color'),
                    size: getUniqueSortedValues(collectionItems, 'size'),
                    year: getUniqueSortedValues(collectionItems, 'year'),
                },
                archive: {
                    brand: getUniqueSortedValues(archiveItems, 'brand'),
                    category: getUniqueSortedValues(archiveItems, 'category'),
                    color: getUniqueSortedValues(archiveItems, 'color'),
                    size: getUniqueSortedValues(archiveItems, 'size'),
                    year: getUniqueSortedValues(archiveItems, 'year'),
                },
                library: {
                    author: getUniqueSortedValues(libraryItems, 'author'),
                    category: getUniqueSortedValues(libraryItems, 'category'),
                    year: getUniqueSortedValues(libraryItems, 'year'),
                }
            };
        };

        const sortOptions = ['name a–z', 'name z–a', 'brand a-z', 'brand z-a', 'year old to new', 'year new to old'];
        
        const Icon = ({ name, size = 16, className = '' }) => {
            const iconProps = { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className: className };
            const icons = {
                Search: e('svg', iconProps, e('circle', { cx: '11', cy: '11', r: '8' }), e('line', { x1: '21', y1: '21', x2: '16.65', y2: '16.65' })),
                ChevronDown: e('svg', iconProps, e('path', { d: 'm6 9 6 6 6-6' })),
                ChevronRight: e('svg', iconProps, e('path', { d: 'm9 18 6-6-6-6' })),
                ArrowLeft: e('svg', iconProps, e('path', { d: 'm12 19-7-7 7-7' }), e('path', { d: 'M19 12H5' })),
                X: e('svg', iconProps, e('line', { x1: '18', y1: '6', x2: '6', y2: '18' }), e('line', { x1: '6', y1: '6', x2: '18', y2: '18' })),
                Filter: e('svg', iconProps, e('polygon', { points: '22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3' })),
                Menu: e('svg', iconProps, e('line', { x1: '3', y1: '12', x2: '21', y2: '12' }), e('line', { x1: '3', y1: '6', x2: '21', y2: '6' }), e('line', { x1: '3', y1: '18', x2: '21', y2: '18' })),
                Instagram: e('svg', iconProps, e('rect', { x: '2', y: '2', width: '20', height: '20', rx: '5', ry: '5' }), e('path', { d: 'M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z' })),
                Mail: e('svg', iconProps, e('path', { d: 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z' }), e('polyline', { points: '22,6 12,13 2,6' }))
            };
            return icons[name] || null;
        };

        const ItemCard = ({ item, navigateTo, page }) => {
            const isSold = item.sold === true;
            const meta = [item.year, item.category, item.color, item.size].filter(Boolean).join(' • ');
            return e('div', { className: "group cursor-pointer flex flex-col animate-fade-in", onClick: () => navigateTo(page, item) },
                e('div', { className: "aspect-square bg-gray-50 overflow-hidden relative border border-gray-100" },
                    e('img', { 
                        src: item.images[0], 
                        className: `w-full h-full object-cover transition-all duration-700 ${isSold ? 'opacity-40 grayscale group-hover:opacity-100 group-hover:grayscale-0' : 'group-hover:scale-105'}` 
                    }),
                    isSold && e('div', { className: 'absolute top-0 left-0 bg-black text-white text-[10px] px-3 py-1.5 font-martian-mono z-10 uppercase tracking-widest' }, 'SOLD OUT')),
                e('div', { className: 'mt-4 text-left' },
                    e('h3', { className: `font-martian-mono uppercase font-bold text-sm tracking-widest ${isSold ? 'text-gray-400' : 'text-black'}` }, item.brand || item.author),
                    e('p', { className: "font-martian-mono uppercase text-sm text-cold-gray tracking-wider mt-1" }, item.name),
                    e('p', { className: "font-martian-mono text-[10px] text-gray-400 mt-2 uppercase tracking-wide" }, meta)));
        };

        const DetailPage = ({ item, navigateTo }) => {
            const [modal, setModal] = useState(null);
            const [currentIdx, setCurrentIdx] = useState(0); 
            const scrollRef = useRef(null);
            const isSold = item.sold === true;

            const handleScroll = (ev) => {
                const width = ev.target.offsetWidth;
                const newIdx = Math.round(ev.target.scrollLeft / width);
                if (newIdx !== currentIdx) setCurrentIdx(newIdx);
            };

            const scrollToImage = (index) => {
                if (scrollRef.current) {
                    scrollRef.current.scrollTo({ left: scrollRef.current.offsetWidth * index, behavior: 'smooth' });
                }
            };

            return e('main', { className: 'container mx-auto px-4 py-8 animate-fade-in' },
                e('button', { onClick: () => window.history.back(), className: 'flex items-center gap-2 font-martian-mono text-[11px] uppercase tracking-widest text-cold-gray hover:text-black transition-colors mb-8' }, e(Icon, { name: 'ArrowLeft' }), 'BACK'),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-12' },
                    e('div', { className: 'relative' },
                        e('div', { ref: scrollRef, onScroll: handleScroll, className: 'flex overflow-x-auto snap-x snap-mandatory no-scrollbar aspect-square bg-gray-50 border border-gray-100' },
                            item.images.map((img, i) => e('div', { key: i, className: 'min-w-full h-full snap-center flex items-center justify-center' },
                                e('img', { src: img, className: `max-w-full max-h-full object-contain ${isSold ? 'opacity-50' : ''}` })))),
                        item.images.length > 1 && e(Fragment, null,
                            e('button', { onClick: () => scrollToImage(currentIdx - 1), disabled: currentIdx === 0, className: `absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 p-2 rounded-full hidden md:block ${currentIdx === 0 ? 'opacity-0' : ''}` }, e(Icon, { name: 'ArrowLeft' })),
                            e('button', { onClick: () => scrollToImage(currentIdx + 1), disabled: currentIdx === item.images.length - 1, className: `absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 p-2 rounded-full hidden md:block ${currentIdx === item.images.length - 1 ? 'opacity-0' : ''}` }, e(Icon, { name: 'ChevronRight' })),
                            e('div', { className: 'absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2' },
                                item.images.map((_, i) => e('div', { key: i, className: `w-1.5 h-1.5 rounded-full transition-all duration-300 ${currentIdx === i ? 'bg-black w-4' : 'bg-black/20'}` }))))),
                    e('div', { className: 'text-left' },
                        e('h2', { className: 'font-martian-mono text-xs uppercase tracking-widest text-cold-gray' }, item.brand || item.author),
                        e('h1', { className: 'font-martian-mono text-xl uppercase mt-1 mb-6' }, item.name),
                        e('div', { className: 'border-t py-6 font-martian-mono text-sm leading-relaxed text-dark-gray' }, item.description),
                        isSold ? e('div', { className: 'mt-10 p-4 border border-gray-100 text-center bg-gray-50 font-martian-mono text-xs uppercase text-cold-gray' }, 'Archival piece - no longer available')
                        : e('div', { className: 'mt-10 space-y-4' },
                            e('button', { onClick: () => setModal('inquiry'), className: 'w-full bg-black text-white py-4 font-martian-mono uppercase tracking-widest text-xs' }, 'Contact for Inquiry'),
                            item.type === 'product' && e('button', { onClick: () => setModal('platforms'), className: 'w-full border border-black py-4 font-martian-mono uppercase tracking-widest text-xs' }, 'Available On Platforms')))),
                e(Modal, { isOpen: modal === 'inquiry', onClose: () => setModal(null), title: 'PRODUCT INQUIRY' }, e(InquiryForm, { item })),
                e(Modal, { isOpen: modal === 'platforms', onClose: () => setModal(null), title: 'AVAILABLE ON' }, e(PlatformsList, { item })));
        };

        const ListPage = ({ items, navigateTo, page, options, searchQuery }) => {
            const [currentPage, setCurrentPage] = useState(1);
            const initialFilters = useMemo(() => Object.keys(options).reduce((acc, k) => ({...acc, [k]: []}), {}), [options]);
            const [selectedFilters, setSelectedFilters] = useState(initialFilters);
            const [sortOrder, setSortOrder] = useState('year new to old');

            // --- SCROLL FIX: Ritorno in cima ---
            useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [currentPage, selectedFilters, searchQuery]);

            const processedItems = useMemo(() => {
                let f = items.filter(item => Object.entries(selectedFilters).every(([k, v]) => v.length === 0 || v.includes(String(item[k]))) && (!searchQuery || [item.name, item.brand].some(s => (s || '').toLowerCase().includes(searchQuery.toLowerCase()))));
                return f.sort((a,b) => sortOrder.includes('new to old') ? b.year - a.year : a.year - b.year);
            }, [items, selectedFilters, sortOrder, searchQuery]);

            const currentItems = processedItems.slice((currentPage-1)*12, currentPage*12);
            return e(Fragment, null,
                e('div', { className: 'sticky top-20 bg-white z-20 py-4 border-b px-4 flex justify-between items-center' },
                    e('button', { className: 'font-martian-mono text-xs uppercase' }, 'Filter'),
                    e('button', { onClick: () => setSelectedFilters(initialFilters), className: 'text-[10px] uppercase underline' }, 'Reset')),
                e('main', { className: 'container mx-auto px-4 py-8' },
                    e('div', { className: 'grid grid-cols-2 lg:grid-cols-4 gap-8' }, currentItems.map(i => e(ItemCard, { key: i.id, item: i, navigateTo, page }))),
                    processedItems.length > 12 && e(Pagination, { itemsPerPage: 12, totalItems: processedItems.length, currentPage, onPageChange: setCurrentPage })));
        };

        const Pagination = ({ itemsPerPage, totalItems, currentPage, onPageChange }) => {
            const total = Math.ceil(totalItems / itemsPerPage);
            return e('nav', { className: 'flex justify-center items-center gap-8 mt-16 font-martian-mono text-xs uppercase tracking-widest' },
                e('button', { onClick: () => onPageChange(currentPage - 1), disabled: currentPage === 1, className: 'disabled:opacity-20' }, 'PREV'),
                e('span', null, `${currentPage} / ${total}`),
                e('button', { onClick: () => onPageChange(currentPage + 1), disabled: currentPage === total, className: 'disabled:opacity-20' }, 'NEXT'));
        };

        const Header = ({ navigateTo, currentRoute, searchQuery, onSearchChange }) => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const navItems = [{ label: 'Collection', page: '#collection' }, { label: 'Archive', page: '#archive' }, { label: 'Library', page: '#library' }, { label: 'Contact', page: '#contact' }];
            return e(Fragment, null, e('header', { className: 'sticky top-0 bg-white bg-opacity-80 backdrop-blur-md border-b z-40 px-4 h-20 flex items-center justify-between' },
                e('a', { href: '#home', className: 'font-bitcount-single text-4xl' }, 'gdarchivio'),
                e('div', { className: 'hidden md:flex items-center gap-8' },
                    navItems.map(i => e('a', { key: i.label, href: i.page, className: 'font-martian-mono uppercase text-xs' }, i.label)),
                    e('input', { type: 'text', placeholder: 'search', className: 'border-b text-xs p-1 font-martian-mono w-32 bg-transparent', value: searchQuery, onChange: (ev) => onSearchChange(ev.target.value) })),
                e('button', { className: 'md:hidden', onClick: () => setIsMenuOpen(!isMenuOpen) }, e(Icon, { name: isMenuOpen ? 'X' : 'Menu', size: 24 }))),
                isMenuOpen && e('div', { className: 'fixed inset-0 bg-white z-50 p-8 flex flex-col items-center justify-center gap-8' },
                    navItems.map(i => e('a', { key: i.label, href: i.page, onClick: () => setIsMenuOpen(false), className: 'font-martian-mono text-2xl uppercase' }, i.label)),
                    e('button', { onClick: () => setIsMenuOpen(false) }, e(Icon, { name: 'X', size: 32 }))));
        };

        const Footer = () => e('footer', { className: 'py-12 border-t mt-20 text-center font-martian-mono text-[10px] text-cold-gray uppercase tracking-widest' }, '© 2025 GDARCHIVIO - ALL RIGHTS RESERVED');

        const App = () => {
            const [route, setRoute] = useState(window.location.hash || '#home');
            const [products, setProducts] = useState([]);
            const [libraryItems, setLibraryItems] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [dynamicFilterOptions, setDynamicFilterOptions] = useState(null);

            useEffect(() => {
                Promise.all([fetch('./products.json').then(r => r.json()), fetch('./library.json').then(r => r.json())])
                .then(([p, l]) => { setProducts(p); setLibraryItems(l); setDynamicFilterOptions(generateFilterOptions(p, l)); });
                const h = () => setRoute(window.location.hash || '#home');
                window.addEventListener('hashchange', h);
                return () => window.removeEventListener('hashchange', h);
            }, []);

            const isHome = route === '#home' || route === '';
            const [p, id] = route.substring(1).split('/');
            const item = [...products, ...libraryItems].find(x => x.id === id);

            const renderPage = () => {
                if (!dynamicFilterOptions) return e('div', { className: 'h-screen flex items-center justify-center font-martian-mono' }, 'Loading...');
                switch(p) {
                    case 'collection': return id ? e(DetailPage, { item }) : e(ListPage, { items: products.filter(x => x.type === 'product'), navigateTo: (path, i) => window.location.hash = `${path}/${i.id}`, page: '#collection', options: dynamicFilterOptions.collection, searchQuery });
                    case 'archive': return id ? e(DetailPage, { item }) : e(ListPage, { items: products.filter(x => x.type === 'archive'), navigateTo: (path, i) => window.location.hash = `${path}/${i.id}`, page: '#archive', options: dynamicFilterOptions.archive, searchQuery });
                    case 'library': return id ? e(DetailPage, { item }) : e(ListPage, { items: libraryItems, navigateTo: (path, i) => window.location.hash = `${path}/${i.id}`, page: '#library', options: dynamicFilterOptions.library, searchQuery });
                    case 'contact': return e('div', { className: 'container mx-auto py-20 font-martian-mono text-center' }, 'CONTACT PAGE');
                    default: return e('div', { className: 'h-screen flex flex-col justify-center items-center' }, e('h1', { className: 'font-bitcount-single text-8xl md:text-[10rem]' }, 'gdarchivio'), e('a', { href: '#collection', className: 'mt-12 border border-black px-12 py-4 font-martian-mono text-xs uppercase tracking-widest' }, 'Enter Collection'));
                }
            };

            return e(Fragment, null, !isHome && e(Header, { currentRoute: route, searchQuery, onSearchChange: setSearchQuery }), renderPage(), !isHome && e(Footer), e(CookieBanner));
        };

        const Modal = ({ isOpen, onClose, children, title }) => isOpen ? e('div', { className: 'fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4', onClick: onClose }, e('div', { className: 'bg-white p-8 max-w-lg w-full relative animate-fade-in', onClick: ev => ev.stopPropagation() }, e('button', { onClick: onClose, className: 'absolute top-4 right-4' }, e(Icon, { name: 'X' })), e('h3', { className: 'text-center font-martian-mono font-bold uppercase mb-6' }, title), children)) : null;
        const InquiryForm = () => e('form', null, e('input', { placeholder: 'NAME', className: 'w-full border-b py-2 mb-4 font-martian-mono text-xs' }), e('button', { className: 'w-full bg-black text-white py-3 font-martian-mono uppercase text-xs' }, 'Send Inquiry'));
        const PlatformsList = ({ item }) => e('div', { className: 'space-y-2' }, Object.entries(item.purchaseLinks || {}).map(([p, u]) => e('a', { key: p, href: u, className: 'block p-4 border font-martian-mono text-center text-xs hover:bg-black hover:text-white transition-all' }, p)));
        const CookieBanner = () => {
            const [isVisible, setIsVisible] = useState(!localStorage.getItem('cookiesAccepted'));
            if (!isVisible) return null;
            return e('div', { className: 'fixed bottom-4 right-4 bg-black text-white p-4 text-[10px] font-martian-mono z-50' }, 
                e('p', { className: 'mb-4 uppercase tracking-widest' }, 'This site uses cookies.'),
                e('button', { onClick: () => { localStorage.setItem('cookiesAccepted', 'true'); setIsVisible(false); }, className: 'bg-white text-black px-4 py-1' }, 'Accept'));
        };

        createRoot(document.getElementById('root')).render(e(App));
    }
    </script>
</body>
</html>
